name: circuit-breaker
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
version_schema: semver
maintainer: "BlkLeg <letshost-admin@proton.me>"
description: "Circuit Breaker — Homelab topology mapper and network documentation tool"
vendor: "BlkLeg"
homepage: "https://github.com/BlkLeg/circuitbreaker"
license: "MIT"
section: "admin"
priority: "optional"

contents:
  # The application tree, whole, at the same root install.sh uses. One layout
  # for both native paths; the unit's ExecStart stays /usr/local/bin/circuit-breaker
  # through the symlink below, so an upgrade from the PyInstaller package
  # changes no unit file — dpkg and rpm both replace a regular file with a
  # symlink of the same path in place.
  - src: dist/native/bundle/python/
    dst: /opt/circuitbreaker/python/
    type: tree
  - src: dist/native/bundle/bin/circuit-breaker
    dst: /opt/circuitbreaker/bin/circuit-breaker
    file_info:
      mode: 0755
  - src: dist/native/bundle/bin/cb-python
    dst: /opt/circuitbreaker/bin/cb-python
    file_info:
      mode: 0755
  - src: /opt/circuitbreaker/bin/circuit-breaker
    dst: /usr/local/bin/circuit-breaker
    type: symlink
  - src: dist/native/bundle/share/
    dst: /opt/circuitbreaker/share/
    type: tree
  - src: dist/native/bundle/agent-binaries/
    dst: /opt/circuitbreaker/agent-binaries/
    type: tree

  - src: cb
    dst: /usr/local/bin/cb
    file_info:
      mode: 0755

  # The historical package paths, kept as symlinks so an env file written by an
  # older postinstall.sh (STATIC_DIR=/usr/local/share/circuit-breaker/frontend
  # and friends) keeps resolving after the upgrade.
  - src: /opt/circuitbreaker/share/frontend
    dst: /usr/local/share/circuit-breaker/frontend
    type: symlink
  - src: /opt/circuitbreaker/share/backend
    dst: /usr/local/share/circuit-breaker/backend
    type: symlink
  - src: /opt/circuitbreaker/share/VERSION
    dst: /usr/local/share/circuit-breaker/VERSION
    type: symlink
  - src: /opt/circuitbreaker/share/build-info.json
    dst: /usr/local/share/circuit-breaker/build-info.json
    type: symlink
  - src: /opt/circuitbreaker/agent-binaries
    dst: /usr/local/share/circuit-breaker/agent-binaries
    type: symlink

  # Default config template
  - src: packaging/config.toml.default
    dst: /usr/local/share/circuit-breaker/config.toml.default
    file_info:
      mode: 0644
  - src: packaging/install.conf
    dst: /etc/circuit-breaker/install.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: deploy/lib/install-identity.sh
    dst: /usr/local/lib/circuitbreaker/install-identity.sh
    file_info:
      mode: 0644

  # systemd unit
  - src: packaging/circuit-breaker.service
    dst: /lib/systemd/system/circuit-breaker.service
    file_info:
      mode: 0644
  - src: packaging/circuit-breaker-worker@.service
    dst: /lib/systemd/system/circuit-breaker-worker@.service
    file_info:
      mode: 0644
  - src: packaging/circuit-breaker-discovery.service
    dst: /lib/systemd/system/circuit-breaker-discovery.service
    file_info:
      mode: 0644

  # The rollback path, and the tool that performs it.
  #
  # docs/release/1.0.0-compatibility-policy.md defines rollback as restoring the
  # complete pre-upgrade backup, and docs/installation/upgrading.md printed
  # `/opt/circuitbreaker/deploy/scripts/restore.sh` as the command that does it.
  # That path belongs to the install.sh layout; a deb/rpm host has no such file,
  # because restore.sh was never in this list. The documented recovery for a bad
  # upgrade could not be performed on a packaged install at all. Shipped here so
  # it can be, with packaging/rollback.sh supplying this layout's paths --
  # restore.sh already takes them as overridable variables and needed only a
  # caller. Found by ADR 0005 Phase 3.
  #
  # Sourced from the repository rather than dist/native/bundle/deploy/ so this
  # does not depend on build_native_release.py having staged the bundle tree
  # before nfpm runs.
  - src: deploy/scripts/restore.sh
    dst: /usr/local/share/circuit-breaker/deploy/scripts/restore.sh
    file_info:
      mode: 0755
  - src: packaging/rollback.sh
    dst: /usr/local/bin/circuit-breaker-rollback
    file_info:
      mode: 0755

  # Create empty dirs
  - dst: /var/lib/circuit-breaker
    type: dir
    file_info:
      mode: 0750
      owner: circuitbreaker
      group: circuitbreaker
  - dst: /var/log/circuit-breaker
    type: dir
    file_info:
      mode: 0750
      owner: circuitbreaker
      group: circuitbreaker
  - dst: /etc/circuit-breaker
    type: dir
    file_info:
      mode: 0755

scripts:
  # preinstall takes the pre-upgrade database backup on an upgrade transaction
  # and does nothing on a fresh install. Without it the package path migrated the
  # schema with nothing to roll back to, while both the compatibility policy and
  # the upgrade docs promised the backup had been taken -- true only of the
  # install.sh path, which does it in deploy/setup.sh's run_upgrade.
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh

# NATS is a `depends`, not a `recommends`. The application refuses to start
# without a broker -- validate_core_dependencies treats it as required for worker
# dispatch, notification delivery and event fan-out -- so a weak dependency lets
# the package manager install something that cannot run. Tier 3 caught exactly
# that on Fedora.
#
# Preferring the distro package over a vendored one is deliberate:
# Dockerfile.mono states the policy ("version pinning on apt packages is
# intentionally avoided to keep CVE fixes current"), and vendoring would make a
# NATS CVE fix wait on a Circuit Breaker release instead of an apt upgrade.
#
# packaging/nfpm-nats.yaml builds a separate `circuit-breaker-nats` package that
# vendors the pinned binary for hosts whose distro packages none. Separate, so
# the vendored CVE surface stays out of this package and an operator pointing
# CB_NATS_URL at an external or clustered broker can decline it.
#
# ── the alternative, and why it is not just `nats-server` ───────────────────
# This read "Debian/Ubuntu ship nats-server, so there we simply depend on it".
# Debian 12 does. Ubuntu 24.04 does. **Ubuntu 22.04 does not** -- jammy packages
# no nats-server in any component -- so the deb was uninstallable on a current
# Ubuntu LTS, and the whole v0.4.0 release stopped at Artifact Smoke after every
# package and image had already been built.
#
# `nats-server | circuit-breaker-nats` keeps the dependency hard, which is what
# the startup validator requires, while letting either broker satisfy it. apt
# prefers the leftmost installable alternative, so Debian 12 and Ubuntu 24.04
# still take the distro's package and the distro still owns its CVE updates; a
# host without one resolves against the companion that now ships beside this
# package for deb as well as rpm. Weakening it to `recommends` instead would have
# turned a loud failure at install time into a crash loop at first boot, which is
# the trade this project keeps refusing to make.
#
# tests/build/test_nats_provisioning_contract.py pins both halves.

# ── rpm-specific settings ──────────────────────────────────────────────────
# `scripts` here is RPMScripts, which is where %posttrans
# lives -- it is NOT available under overrides.rpm, whose `scripts` is the
# packager-agnostic set (preinstall/postinstall/preremove/postremove). nfpm
# ignores an unknown key there silently, so the first attempt at this wiring
# produced a package with no posttrans at all and no error to say so.
#
# %posttrans is the only scriptlet that runs after the OLD package's %preun,
# which rpm executes *after* the new package's %post. Every released version
# through v1.0.0-rc.4 ships a %preun that stops and disables the unit
# unconditionally, so without this every upgrade from a shipped version ends with
# the service down and disabled and no reboot brings it back. deb and apk need no
# equivalent: dpkg runs the old prerm before unpack and the new postinst last, so
# postinstall.sh's try-restart is already the final word there.
rpm:
  scripts:
    posttrans: packaging/posttrans.sh

overrides:
  deb:
    depends:
      - age
      - libc6
      - nats-server | circuit-breaker-nats
    recommends:
      - postgresql
      # postgresql-client, not just the server: preinstall.sh's pre-upgrade
      # backup needs pg_dump and pg_isready, and a host pointing CB_DB_URL at a
      # database on another machine installs no server at all. Without a client
      # the gate can only skip the backup and say so, which is a rollback the
      # operator does not have.
      - postgresql-client
      - redis-server
  rpm:
    depends:
      - age
      - glibc
    recommends:
      - postgresql-server
      # The client package, for pg_dump/pg_isready — see the deb note above.
      - postgresql
      - redis
      # Fedora packages no broker, so this names our own. `recommends` is the
      # right strength here rather than `depends`: dnf installs weak dependencies
      # by default, so a plain `dnf install circuit-breaker` gets a working
      # broker — while an operator pointing CB_NATS_URL at an external or
      # clustered NATS can decline it with --setopt=install_weak_deps=False.
      # Depending on it outright would forbid that topology, which is what the
      # unit's Wants= is careful not to do.
      - circuit-breaker-nats
  apk:
    depends:
      - postgresql16
      - redis
      - nginx
      - nats-server
