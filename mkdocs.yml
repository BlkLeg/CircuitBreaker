# Pages that are deliberately reachable by URL but absent from the sidebar.
# Declaring them turns MkDocs' "not included in nav" notice from an INFO into a
# WARNING for anything NOT listed here, so --strict fails on a page that fell
# out of the nav by accident rather than by decision.
#   - adr/, design/          — records, linked from the pages that cite them
#   - assets/screenshots/MANIFEST.md — provenance record for the image assets
#   - installation/docker-compose-prod.md — redirect stub kept for old bookmarks
#     (its content moved into installation/docker-compose.md); a dead sidebar
#     entry would be worse than none
#   - the three audit/plan documents — working records, not product docs
# Without this, "page exists but is not in the nav" is logged at INFO, which
# --strict does not fail on, so a page can silently drop out of the sidebar.
validation:
  nav:
    omitted_files: warn

not_in_nav: |
  /adr/*.md
  /design/*.md
  /assets/screenshots/MANIFEST.md
  /installation/docker-compose-prod.md
  /1.0.0-release-readiness-audit.md
  /cross-browser-audit.md
  /mono-db-production-plan.md

# Pages that are not part of the published site at all — not in the sidebar and
# not reachable by URL, unlike the not_in_nav entries above. `mkdocs build
# --strict` fails on any page in docs/ that is in neither list, which is what
# turned the Docs workflow red when this file landed.
#   - 1.0.0-incomplete-features.md — an action list for dev review of what did
#     not make 1.0.0. It tracks work in flight rather than describing shipped
#     behaviour, so it is excluded outright rather than published unlinked the
#     way the audit/plan records above are.
exclude_docs: |
  /1.0.0-incomplete-features.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
