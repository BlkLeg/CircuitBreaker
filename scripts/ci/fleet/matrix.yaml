# scripts/ci/fleet/matrix.yaml
#
# The single source of truth for what this project claims works (design §7.2).
# It feeds both this tier and the support-tier table in §8, so a row here is a
# published promise, not a convenience.
#
# `runner` is the ONLY field that varies by execution site. tier3-artifact.sh is
# identical across every row (P1); anything distro-specific belongs in that row's
# provisioning.
#
# `tier` is the §8 support tier this row backs:
#   1 = guaranteed to install, boot, upgrade and roll back
#   2 = guaranteed to install and boot
#   3 = guaranteed to build; installation best-effort
#
# `mode` is which half of the Tier 1 guarantee the row actually exercises:
#   install = install, boot, exercise            (Phase 2)
#   upgrade = all of the above on version N-1, then upgrade to N, then execute
#             the documented rollback and assert the pre-upgrade state is back
#             (Phase 3)
# A `tier: 1` row is only fully backed once a matching `mode: upgrade` row
# passes. ADR 0005's "Tier guarantees: when they take effect" table is what
# records whether that has happened; adding the row below does not move it.
#
# Release 44, not the 42 this plan was drafted against: 42 reached EOL and its
# mirror tree 404s, and 44 is what the fleet host itself runs. Bump deliberately
# — a new release is a new claim, and the digest below must be re-resolved from
# Fedora's published CHECKSUM every time it moves.
#
# image_url is dl.fedoraproject.org rather than download.fedoraproject.org: the
# latter is a mirror redirector, and the mirror it chose did not carry the file.
# A release gate should not depend on which mirror answered today.
#
# Phase 3 adds the second row below. The remaining §7.2 rows — debian/deb,
# arm64, and the Tier 3 formats — are the later slices of this phase and each
# needs its own cloud-init fixture before it can be listed here. A row without
# provisioning is a claim the tier cannot support.

- id: fedora-rpm-amd64
  distro: fedora-44
  format: rpm
  arch: amd64
  runner: local/qemu
  tier: 1
  mode: install
  image_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
  image_sha256: "28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"

# Same host, same image, same script — the difference is that this row is handed
# a second package and made to prove the whole lifecycle. It is deliberately a
# separate row rather than a flag on the one above: the install claim and the
# upgrade claim fail for different reasons and an operator reading the evidence
# directory should be able to tell which one broke without opening a log.
- id: fedora-rpm-amd64-upgrade
  distro: fedora-44
  format: rpm
  arch: amd64
  runner: local/qemu
  tier: 1
  mode: upgrade
  image_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
  image_sha256: "28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
