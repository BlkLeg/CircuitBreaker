name: Composed Agent E2E

# AGT-01: the composed Docker journey must run against every RC and on a
# schedule. It ran nowhere — ci.yml and dev-ci.yml both declared it
# "deliberately NOT run here and remains a local/manual gate", and release.yml
# never invoked it. 35+ minutes is a fair reason to keep it off the PR path;
# it is not a reason for it never to run.
#
# The per-RC half of that runs here, on the tag push, rather than as a job
# called from release.yml. AGT-01 also wants the journey *required* before
# publication, and it is not: the agent has open troubleshooting and likely
# missing development, so this suite is expected to fail for a while, and as a
# gate it would hold every artifact of an otherwise-green release. The AGT-01
# ledger row is `not_started`/`not_evidenced` and stays that way — it cannot be
# evidenced as passing while publication does not depend on it. `workflow_call`
# is kept for exactly that restoration: re-gating is one job in release.yml.
on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  composed-journey:
    name: Composed agent journey
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # httpx, not requests: every HTTP call in test_agent_e2e.py and
      # test_agent_release_gate.py goes through httpx.Client, and `requests` was
      # installed here but imported by nothing. Collection therefore died on
      # `ModuleNotFoundError: No module named 'httpx'` before a single container
      # started, so this job has never got past collection since it was added.
      #
      # websockets for the same reason: _PresenceStream (test_agent_e2e.py:532)
      # and the discovery stream (:3564) both open a websocket with
      # `websockets.sync.client.connect`, and it was never installed here, so
      # every test that asserts against a push stream died on
      # `ModuleNotFoundError: No module named 'websockets'` — 11 of 12, after
      # each had already built and run its containers.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout httpx websockets

      # BLOCKING-2/6: GOV-12 untracked apps/agent/e2e/.env and replaced it
      # with .env.example, but nothing recreated it. Every test in the suite
      # shells out to `docker compose -f apps/agent/e2e/docker-compose.yml`,
      # which `extends` the repo-root compose file and so has to interpolate
      # its ${VAR:?...} guards from that .env — without it even `config` exits
      # 1 ("required variable CB_DB_PASSWORD is missing a value"), before a
      # single container is built. conftest.py's autouse fixture runs this same
      # helper, so a local `pytest` needs no preceding ritual; running it here
      # as well means the file also exists for the non-pytest parts of this job
      # and that a template problem fails on a step that names itself rather
      # than 40 minutes into the journey. `config` is the smoke check that the
      # materialised file actually satisfies every guard.
      - name: Materialise the e2e env file
        run: |
          cd apps/agent/e2e
          python ensure_env.py
          docker compose -f docker-compose.yml config >/dev/null

      # REL-20: a recorded seed is what makes a failed run reproducible.
      - name: Run the composed journey
        env:
          CB_E2E_SEED: ${{ github.run_id }}
        run: |
          cd apps/agent/e2e
          python -m pytest test_agent_e2e.py -v \
            --junitxml=junit-agent-e2e.xml \
            --timeout=3600

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "diagnostics/${c}.log" 2>&1 || true
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: composed-agent-e2e
          path: |
            apps/agent/e2e/junit-agent-e2e.xml
            diagnostics/
          retention-days: 30
