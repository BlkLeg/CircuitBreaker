name: Release

# Two channels, one file (docs/superpowers/specs/2026-09-22-installer-and-release-design.md §5).
#
#   channel=candidate  build → gate → smoke → journey → image → parity → scan →
#                      sign → DRAFT release vX + candidate.json. No tag exists.
#   channel=stable     verify the draft against this ref and the registry,
#                      retag the candidate's image digest, publish the draft —
#                      which is the step that creates the tag. No build.
#
# A tag pushed by hand runs only tag-verify, which asserts a published release
# already exists for it: a tag is the result of a release, never its cause.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: the release captain chooses the channel and, for a promote, names the draft.
    inputs:
      channel:
        description: "candidate: build, gate and stage a draft. stable: promote an existing draft (no build)."
        required: true
        type: choice
        options: [candidate, stable]
      version:
        description: "stable only: the version whose draft is promoted. Must equal VERSION at this ref."
        required: false
        type: string
        default: ""

permissions:
  contents: write    # create GitHub Release, upload assets
  packages: write    # push Docker image to GHCR
  id-token: write    # OIDC for cosign keyless signing
  security-events: write  # upload container image scan SARIF to code scanning

jobs:
  # ── Derive version ────────────────────────────────────────────────────────────
  version:
    name: Derive Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # The parity gate below needs the tree; this job previously had no
      # checkout because it only ever read the ref name.
      - uses: actions/checkout@v5

      - name: Derive version string
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ inputs.channel }}" = "stable" ]; then
            [ "${{ inputs.version }}" = "${VERSION}" ] \
              || { echo "::error::inputs.version='${{ inputs.version }}' must equal VERSION='${VERSION}' at this ref"; exit 1; }
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # GOV-09: the git tag is not authoritative, VERSION is. Fail before
      # anything is built if they disagree, rather than shipping artifacts
      # whose name and contents claim different versions.
      - name: Assert version parity
        run: python3 scripts/check_version_parity.py --expected "${{ steps.ver.outputs.version }}"

  # ── Tier 0 gate (C2) ─────────────────────────────────────────────────────────
  # The gates run HERE rather than depending on ci.yml: a workflow_run
  # dependency is only as good as whether ci.yml happened to run on the tagged
  # commit, and on a tag push it generally has not. This asserts the tagged tree
  # itself passes, which is the claim that matters.
  gate:
    name: Release Gate (Tier 0)
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      - name: Tier 0 — static gates
        env:
          CB_DB_URL: postgresql://cb_ci:cb_ci@127.0.0.1:5432/cb_ci
        run: scripts/ci/tier0-static.sh

      - name: Security gate
        run: scripts/security_scan.sh --gate

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: |
            artifacts/junit/
            security_scan_report.md
          if-no-files-found: warn
          retention-days: 90

  # ── Build all packages ────────────────────────────────────────────────────────
  build:
    name: Build Packages
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, gate]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      # Slice 4.2 (F3). Passed explicitly rather than with `secrets: inherit`
      # so the build job receives this one secret and nothing else. The
      # public half is a repository variable, not a secret: it is public by
      # construction, and keeping it out of the secret store lets a fork see
      # which key the official builds use.
      signing_pubkey: ${{ vars.AGENT_SIGNING_PUBLIC_KEY }}
    secrets:
      AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.AGENT_SIGNING_PRIVATE_KEY }}

  # ── Installed-artifact gate (GOV-20) ─────────────────────────────────────────
  # Nothing may be published until the exact built candidate has been installed
  # on a clean host and uninstalled again.
  artifact-smoke:
    name: Artifact Smoke
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, build]
    uses: ./.github/workflows/artifact-smoke.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # ── Installer journey (install.sh on real distros) ───────────────────────────
  installer-journey:
    name: Installer Journey
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, gate]
    uses: ./.github/workflows/installer-journey.yml
    with:
      previous_release: ${{ vars.CB_PREVIOUS_PYINSTALLER_RELEASE }}

  # ── Container image, built natively per architecture ─────────────────────────
  # One runner per architecture, never a single emulated
  # `buildx --platform linux/amd64,linux/arm64`: buildx runs both platforms and
  # every independent stage concurrently, so an emulated arm64 leg carrying pip,
  # npm and Go builds at once OOM-kills apt mid-index-read. Native runners
  # remove the emulation and the contention together.
  #
  # Each leg pushes by digest under no tag; the merge job below is what makes
  # those digests addressable, so a half-built release leaves no usable tag.
  image:
    name: Build Image (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, gate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The private key reaches the build as a BuildKit secret written to a
      # file, NEVER as --build-arg: build args land in image metadata and are
      # readable with `docker history`. The public half is a plain build arg
      # because it is public by construction — compiled into the binary.
      - name: Stage the agent signing key
        env:
          AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.AGENT_SIGNING_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "${AGENT_SIGNING_PRIVATE_KEY}" > /tmp/agent-signing-key

      - name: Build and push by digest
        id: build
        run: |
          IMAGE="ghcr.io/blkleg/circuitbreaker"
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            -f Dockerfile.mono \
            --build-arg SIGNING_PUBKEY="${{ vars.AGENT_SIGNING_PUBLIC_KEY }}" \
            --secret id=agent_signing_key,src=/tmp/agent-signing-key \
            --provenance=true \
            --sbom=true \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/build-metadata.json \
            .

      - name: Shred the staged signing key
        if: always()
        run: |
          shred -u /tmp/agent-signing-key 2>/dev/null || rm -f /tmp/agent-signing-key

      # Kept separate from the shred above, and NOT `if: always()`. Folding the
      # two together once cost a release: as a plain scalar the continuation
      # lines joined onto the `shred ... || rm -f ...` line, so a successful
      # shred short-circuited the `||` and the digest was never written — while
      # the step still exited 0. tests/build/test_workflow_run_blocks.py guards
      # the shape; this step stays on its own so there is no `||` to swallow it.
      - name: Record the image digest
        run: |
          DIGEST=$(python3 -c "import json;print(json.load(open('/tmp/build-metadata.json'))['containerimage.digest'])")
          echo "built ${{ matrix.arch }} -> ${DIGEST}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      # The digest is the whole handoff to the merge job: the filename is the
      # digest, so the job below needs no parsing and cannot mix the two up.
      - name: Export digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Export the image's provenance
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            -f Dockerfile.mono \
            --target app-build-info \
            --output type=local,dest=/tmp/image-info .
          cat /tmp/image-info/build-info.json

      - name: Upload the image's provenance
        uses: actions/upload-artifact@v7
        with:
          name: image-build-info-${{ matrix.arch }}
          path: /tmp/image-info/build-info.json
          if-no-files-found: error
          retention-days: 1

      # REL-20: a failed release job must be diagnosable from what was kept.
      # The step above runs only on success, so before this a failed image
      # build left nothing behind but a workflow log that expires with the run.
      # buildx's metadata file names the base image, the resolved digests and
      # the build options actually used.
      - name: Upload image build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-build-diagnostics-${{ matrix.arch }}
          path: /tmp/build-metadata.json
          if-no-files-found: warn
          retention-days: 30

  # ── Assemble the multi-arch manifest list ────────────────────────────────────
  # GOV-20 twice over: the tag list comes from scripts/release_channel.py so a
  # candidate cannot move :latest, and THIS job — not the matrix above — is what
  # `artifact-smoke` gates, because it is the first point at which any tag
  # exists. The matrix pushes only untagged blobs nothing can pull by name.
  image-merge:
    name: Merge Image Manifest
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, build, artifact-smoke, installer-journey, image]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Download per-architecture digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list
        id: merge
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/blkleg/circuitbreaker"
          TAG_ARGS=""
          FIRST_TAG=""
          for tag in $(python3 scripts/release_channel.py --version "${VERSION}" --channel candidate --field tags); do
            TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${tag}"
            [ -n "${FIRST_TAG}" ] || FIRST_TAG="${tag}"
          done
          echo "Publishing tags:${TAG_ARGS}"

          # One file per architecture, each named for the digest it carries.
          # Two are expected; anything else means a leg silently vanished.
          cd /tmp/digests
          COUNT=$(find . -maxdepth 1 -type f | wc -l)
          if [ "${COUNT}" -ne 2 ]; then
            echo "::error::expected 2 per-architecture digests, found ${COUNT}"
            ls -la
            exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create ${TAG_ARGS} \
            $(printf "${IMAGE}@sha256:%s " *)

          # The manifest-list digest is what everything downstream signs, scans
          # and attests, so read it back from the registry rather than assuming
          # imagetools echoed it.
          docker buildx imagetools inspect "${IMAGE}:${FIRST_TAG}" \
            --format '{{json .Manifest}}' > /tmp/manifest-descriptor.json
          DIGEST=$(python3 -c "import json;print(json.load(open('/tmp/manifest-descriptor.json'))['digest'])")
          echo "digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "manifest list ${IMAGE}@${DIGEST}"

      # REL-20: the descriptor read back from the registry is the record of
      # what was published, and it is what a post-mortem needs when the tag has
      # since moved.
      - name: Upload manifest descriptor
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-manifest-descriptor
          path: /tmp/manifest-descriptor.json
          if-no-files-found: warn
          retention-days: 30

  # ── Runtime parity: image and package are the same application (D7) ─────────
  runtime-parity:
    name: Runtime parity (image == package)
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, build, image]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download the candidate packages
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/release/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image provenance
        uses: actions/download-artifact@v5
        with:
          pattern: image-build-info-*
          merge-multiple: false
          path: image-info/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare runtime provenance (image == package)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "unpacked-${arch}"
            tar -xzf "dist/release/circuit-breaker_${VERSION}_linux_${arch}.tar.gz" \
              -C "unpacked-${arch}" share/build-info.json
            python3 scripts/ci/assert_runtime_parity.py \
              "unpacked-${arch}/share/build-info.json" \
              "image-info/image-build-info-${arch}/build-info.json"
          done

  # ── Stage a DRAFT GitHub Release (candidate channel) ─────────────────────────
  release:
    name: Stage Draft Release
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'candidate'
    needs: [version, build, artifact-smoke, installer-journey, image-merge, runtime-parity]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # specs/1.0.0/release-control/ governs a future milestone. Nothing
      # governed v0.4.2. This is the per-release equivalent, and it runs before
      # anything is attached to a Release.
      - name: Assert release readiness
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release_checklist.py --version "${VERSION}"

      - name: Download all package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/release/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The tarballs carry a .sha256 written by the build that produced them,
      # inside the same artifact. Checking it here is what makes the SHA256SUMS
      # generated below a statement about the bytes the BUILD made, rather than
      # about whatever bytes arrived: without it, an artifact corrupted between
      # the build job and this one would simply be checksummed in its corrupted
      # state and published with a checksum that matches.
      #
      # It also pins the other half of "consume the exact artifacts": these
      # files are downloaded from the run's own artifact store, and nothing in
      # this job rebuilds anything.
      - name: Verify every downloaded tarball against the checksum its build wrote
        run: |
          set -euo pipefail
          cd dist/release/
          shopt -s nullglob
          checked=0
          for sum in *.tar.gz.sha256; do
            echo "verifying ${sum%.sha256}"
            sha256sum -c "${sum}"
            checked=$((checked + 1))
          done
          if [ "${checked}" -eq 0 ]; then
            echo "::error::no *.tar.gz.sha256 arrived with the packages; the build no longer ships the checksum this step verifies, so nothing here confirms the artifacts are the ones that were built"
            ls -la
            exit 1
          fi
          echo "verified ${checked} build-time checksums"

      # Every architecture that will be published has to be present before the
      # release is assembled. A missing leg otherwise produces a release that is
      # simply short an architecture, which nothing downstream notices: the
      # manifest check covers the container, and nothing covered the packages.
      - name: Assert both architectures arrived
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/release/
          missing=""
          for arch in amd64 arm64; do
            for suffix in tar.gz deb rpm; do
              case "${suffix}" in
                tar.gz) name="circuit-breaker_${VERSION}_linux_${arch}.tar.gz" ;;
                *)      name="circuit-breaker_${VERSION}_${arch}.${suffix}" ;;
              esac
              [ -f "${name}" ] || missing="${missing} ${name}"
            done
          done
          if [ -n "${missing}" ]; then
            echo "::error::the build produced no:${missing}"
            ls -la
            exit 1
          fi
          echo "both architectures present in every packaged format"

      - name: Generate preliminary SHA256SUMS
        run: |
          cd dist/release/
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS
          cat SHA256SUMS

      - name: Install syft v1.14.0
        run: |
          curl -sSfL \
            https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_linux_amd64.tar.gz \
            -o /tmp/syft.tar.gz
          echo "21653debfeccb278576ffdd85b5dbe8cd44fcb820cae71e887a6ac2efb399d37  /tmp/syft.tar.gz" | sha256sum -c
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft version

      - name: Generate source SBOMs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          syft scan dir:apps/backend \
            --exclude '**/node_modules' \
            --output "cyclonedx-json=dist/release/circuit-breaker_${VERSION}_sbom-backend.cdx.json" \
            --output "spdx-json=dist/release/circuit-breaker_${VERSION}_sbom-backend.spdx.json"
          syft scan dir:apps/frontend \
            --exclude '**/node_modules' \
            --output "cyclonedx-json=dist/release/circuit-breaker_${VERSION}_sbom-frontend.cdx.json" \
            --output "spdx-json=dist/release/circuit-breaker_${VERSION}_sbom-frontend.spdx.json"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # No QEMU here any more: RC-02 claims amd64 AND arm64 for the container
      # channel, and both are now built natively by the `image` matrix above and
      # combined by `image-merge`. This job consumes the published manifest list
      # and never builds an image itself.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Prove both architectures are in the published manifest rather than
      # trusting that the merge did what it was asked.
      - name: Assert published manifest covers both architectures
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/blkleg/circuitbreaker:${VERSION}-candidate" --raw > /tmp/manifest.json
          python3 - <<'PY'
          import json, sys
          index = json.load(open("/tmp/manifest.json"))
          found = {
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in index.get("manifests", [])
              if "platform" in m and m["platform"].get("architecture") != "unknown"
          }
          required = {"linux/amd64", "linux/arm64"}
          missing = required - found
          if missing:
              print(f"::error::published manifest is missing {sorted(missing)}; found {sorted(found)}")
              sys.exit(1)
          print(f"manifest covers {sorted(found)}")
          PY

      # SEC-18 claims container vulnerability scanning; before this step the
      # pipeline only ever ran `trivy fs`/`config` over the source tree, so the
      # base image and OS packages the image actually ships were never scanned.
      # Placed before cosign so a HIGH/CRIT image is never signed or attested.
      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.image-merge.outputs.digest }}
          format: sarif
          output: trivy-image-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Block only on findings that can be acted on. The base image carries
          # ~105 HIGH/CRIT Debian stable CVEs marked fix_deferred or
          # will_not_fix, with no upstream patch to apply — a gate that can never
          # pass gets bypassed rather than obeyed. Any NEW vulnerability that has
          # a fix still fails the release, and the SARIF upload below is
          # unfiltered so everything stays visible in code scanning.
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: '.trivyignore'

      - name: Upload container image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Install cosign v2.4.1
        run: |
          curl -sSfL \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 \
            -o /tmp/cosign
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  /tmp/cosign" | sha256sum -c
          sudo mv /tmp/cosign /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign
          cosign version

      - name: Generate container SBOM
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: |
          syft scan "${IMAGE_DIGEST}" \
            --output "cyclonedx-json=dist/release/circuit-breaker_${VERSION}_sbom-container.cdx.json"

      - name: Sign Docker image with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Attach container SBOM to image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: |
          cosign attach sbom \
            --sbom "dist/release/circuit-breaker_${VERSION}_sbom-container.cdx.json" \
            --type cyclonedx \
            "${IMAGE_DIGEST}"

      - name: GPG sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY not set — skipping GPG signing"
            exit 0
          fi
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

          cd dist/release/
          for f in *.tar.gz *.deb *.rpm *.apk *.pkg.tar.zst *.AppImage *.json; do
            [ -f "$f" ] && [[ "$f" != *.asc ]] || continue
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${GPG_PASSPHRASE}" \
                --armor --detach-sign "$f"
          done

          # Regenerate SHA256SUMS (now includes .asc + SBOM files) then sign it
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --armor --detach-sign SHA256SUMS

      - name: Remove bundle directory from release artifacts
        run: rm -rf dist/release/bundle

      - name: Write candidate.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sums = {}
          for line in Path("dist/release/SHA256SUMS").read_text().splitlines():
              digest, _, name = line.partition("  ")
              sums[name.removeprefix("./")] = digest
          Path("dist/release/candidate.json").write_text(json.dumps({
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "channel": "candidate",
              "image_digest": os.environ["IMAGE_DIGEST"],
              "assets": sums,
          }, indent=2) + "\n")
          PY
          cat dist/release/candidate.json

      - name: Stage the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cp install.sh setup.sh
          # A previous candidate for this version is replaced, a published
          # release is not: promoting is the only way a draft becomes visible,
          # and re-running the candidate must never touch what users can see.
          if gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v${VERSION}" --yes
          elif gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::v${VERSION} is already published; bump VERSION rather than rebuilding a released version"
            exit 1
          fi
          # --draft: no tag is created until the draft is published (promote).
          # --target: the commit the tag will point at, which is this one.
          gh release create "v${VERSION}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Circuit Breaker v${VERSION}" \
            --generate-notes \
            dist/release/* \
            install.sh \
            setup.sh \
            packaging/circuit-breaker-release-key.asc
          echo "draft v${VERSION} staged at ${GITHUB_SHA}; promote with: make release-promote"

  promote-verify:
    name: Verify the candidate before promoting
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    outputs:
      image_digest: ${{ steps.candidate.outputs.image_digest }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the draft's candidate.json and hold it to this ref
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft)" = "true" ] \
            || { echo "::error::v${VERSION} has no draft to promote (run channel=candidate first, or it is already published)"; exit 1; }
          gh release download "v${VERSION}" --pattern candidate.json --dir /tmp
          COMMIT="$(python3 -c 'import json;print(json.load(open("/tmp/candidate.json"))["commit"])')"
          [ "${COMMIT}" = "${GITHUB_SHA}" ] \
            || { echo "::error::the draft was built from ${COMMIT}; this promote was dispatched on ${GITHUB_SHA}. Dispatch on the candidate's commit."; exit 1; }
          DIGEST="$(python3 -c 'import json;print(json.load(open("/tmp/candidate.json"))["image_digest"])')"
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python3 scripts/release_channel.py --version "${VERSION}" --field prerelease)" >> "$GITHUB_OUTPUT"
      - name: Assert the candidate tag still resolves to the recorded digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.candidate.outputs.image_digest }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          LIVE="$(docker buildx imagetools inspect "ghcr.io/blkleg/circuitbreaker:${VERSION}-candidate" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          [ "ghcr.io/blkleg/circuitbreaker@${LIVE}" = "${IMAGE_DIGEST}" ] \
            || { echo "::error:::${VERSION}-candidate now points at ${LIVE}, not the digest the draft recorded"; exit 1; }
      - name: Assert the draft's assets still match candidate.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets && gh release download "v${VERSION}" --pattern 'SHA256SUMS' --dir /tmp/assets
          python3 - <<'PY'
          import json
          recorded = json.load(open("/tmp/candidate.json"))["assets"]
          live = {}
          for line in open("/tmp/assets/SHA256SUMS"):
              digest, _, name = line.rstrip("\n").partition("  ")
              live[name.removeprefix("./")] = digest
          assert live == recorded, "the draft's SHA256SUMS no longer matches candidate.json"
          print(f"{len(live)} assets verified")
          PY
      - name: Assert release readiness
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release_checklist.py --version "${VERSION}"

  promote:
    name: Promote the candidate to stable
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: [version, promote-verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Retag the candidate's image digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.promote-verify.outputs.image_digest }}
        run: |
          set -euo pipefail
          case "${IMAGE_DIGEST}" in
            *@sha256:*) ;;
            *) echo "::error::IMAGE_DIGEST must be repo@sha256:...; got ${IMAGE_DIGEST}"; exit 1 ;;
          esac
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG_ARGS=""
          for tag in $(python3 scripts/release_channel.py --version "${VERSION}" --channel stable --field tags); do
            TAG_ARGS="${TAG_ARGS} -t ghcr.io/blkleg/circuitbreaker:${tag}"
          done
          echo "retagging ${IMAGE_DIGEST} as:${TAG_ARGS}"
          # shellcheck disable=SC2086
          docker buildx imagetools create ${TAG_ARGS} "${IMAGE_DIGEST}"
      - name: Publish the draft (this creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.promote-verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAG="--prerelease=false"
          [ "${PRERELEASE}" != "true" ] || FLAG="--prerelease"
          gh release edit "v${VERSION}" --draft=false ${FLAG} --latest="$([ "${PRERELEASE}" = "true" ] && echo false || echo true)"
          echo "published v${VERSION}; tag created at ${GITHUB_SHA}"

  post-publish:
    name: Verify the published release
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: [version, promote]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      # Everything upstream verifies a candidate. This verifies the RELEASE:
      # the assets as named and attached, the checksums as published, the API
      # as it answers install.sh, fetched over the network a user would use.
      #
      # It is the only check that exercises asset naming, checksum publication,
      # API propagation and install.sh's own discovery logic. Had it existed,
      # v0.4.2 would have been caught minutes after publication rather than by
      # the people who installed it.
      - name: Download the published tarball and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p published && cd published
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "circuit-breaker_${VERSION}_linux_amd64.tar.gz" \
            --pattern "SHA256SUMS"
          ls -lh

      - name: Verify the published tarball against the published checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd published
          grep -E "( |/|^)circuit-breaker_${VERSION}_linux_amd64.tar.gz\$" SHA256SUMS > expected.sha256 || {
            echo "::error::SHA256SUMS publishes no entry for the amd64 tarball"
            cat SHA256SUMS
            exit 1
          }
          sha256sum -c expected.sha256

      - name: Assert the published binary can load the application it serves
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd published
          mkdir -p unpacked
          tar -xzf "circuit-breaker_${VERSION}_linux_amd64.tar.gz" -C unpacked
          if [ -x "unpacked/bin/circuit-breaker" ]; then
            BUNDLE="unpacked"
          else
            BUNDLE="$(find unpacked -maxdepth 1 -mindepth 1 -type d | head -1)"
          fi
          "${BUNDLE}/bin/circuit-breaker" --selftest

      # install.sh resolves a release through the GitHub API. A release that is
      # published but not yet discoverable, or discoverable under an unexpected
      # asset name, is an install that fails for everyone while every build gate
      # stays green.
      - name: Assert install.sh can discover and resolve this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          RESOLVED="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --jq '.tag_name')"
          [ "${RESOLVED}" = "v${VERSION}" ] \
            || { echo "::error::API resolved '${RESOLVED}', expected 'v${VERSION}'"; exit 1; }

          ASSET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --jq ".assets[] | select(.name == \"circuit-breaker_${VERSION}_linux_amd64.tar.gz\") | .name")"
          [ -n "${ASSET}" ] \
            || { echo "::error::the amd64 tarball asset install.sh downloads is not attached to the release"; exit 1; }
          echo "release discoverable and asset present: ${ASSET}"

      # The tag was created by the API, and a tag created with GITHUB_TOKEN
      # fires no `push: tags:` workflow. e2e.yml's tag trigger therefore never
      # sees a release any more; dispatch it on the tag explicitly.
      - name: Dispatch the composed agent E2E on the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh workflow run e2e.yml --ref "v${VERSION}"

  # A hand-pushed tag proves nothing and builds nothing. It is accepted only
  # when it names a release that promote already published.
  tag-verify:
    name: Verify a pushed tag names a published release
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: The tag must already be a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "${GITHUB_REF_NAME} is a published release; nothing to do"
            exit 0
          fi
          echo "::error::${GITHUB_REF_NAME} was pushed by hand. Releases are made with 'make release-candidate' then 'make release-promote'; the promote creates the tag. Delete this tag: git push origin :refs/tags/${GITHUB_REF_NAME}"
          exit 1

