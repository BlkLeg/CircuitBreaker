name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: Manual release promotion requires the release captain to supply the approved version.
    inputs:
      version:
        description: "Version to release (e.g. 0.1.3, without the v prefix)"
        required: true

permissions:
  contents: write    # create GitHub Release, upload assets
  packages: write    # push Docker image to GHCR
  id-token: write    # OIDC for cosign keyless signing
  security-events: write  # upload container image scan SARIF to code scanning

jobs:
  # ── Derive version ────────────────────────────────────────────────────────────
  version:
    name: Derive Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Derive version string
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Strip leading 'v' from tag
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  # ── Build all packages ────────────────────────────────────────────────────────
  build:
    name: Build Packages
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # ── Create GitHub Release + push Docker ──────────────────────────────────────
  release:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/release/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate preliminary SHA256SUMS
        run: |
          cd dist/release/
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS
          cat SHA256SUMS

      - name: Install syft v1.14.0
        run: |
          curl -sSfL \
            https://github.com/anchore/syft/releases/download/v1.14.0/syft_1.14.0_linux_amd64.tar.gz \
            -o /tmp/syft.tar.gz
          echo "21653debfeccb278576ffdd85b5dbe8cd44fcb820cae71e887a6ac2efb399d37  /tmp/syft.tar.gz" | sha256sum -c
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft version

      - name: Generate source SBOMs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          syft scan dir:apps/backend \
            --exclude '**/node_modules' \
            --output "cyclonedx-json=dist/release/circuit-breaker_${VERSION}_sbom-backend.cdx.json" \
            --output "spdx-json=dist/release/circuit-breaker_${VERSION}_sbom-backend.spdx.json"
          syft scan dir:apps/frontend \
            --exclude '**/node_modules' \
            --output "cyclonedx-json=dist/release/circuit-breaker_${VERSION}_sbom-frontend.cdx.json" \
            --output "spdx-json=dist/release/circuit-breaker_${VERSION}_sbom-frontend.spdx.json"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # RC-02 claims amd64 AND arm64 for the container channel, but this step
      # ran a plain `docker build` on an amd64 runner, so the published image
      # was amd64 only and the support contract promised something that was
      # never built. Native packages were already dual-arch via build.yml's
      # ubuntu-22.04 + ubuntu-22.04-arm matrix; only the image was not.
      #
      # GOV-20: the tag list comes from scripts/release_channel.py, so a
      # release candidate cannot move :latest.
      - name: Build and push Docker image
        id: docker_push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/blkleg/circuitbreaker"
          TAG_ARGS=""
          for tag in $(python3 scripts/release_channel.py --version "${VERSION}" --field tags); do
            TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${tag}"
          done
          echo "Publishing tags:${TAG_ARGS}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.mono \
            ${TAG_ARGS} \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/build-metadata.json \
            --push \
            .
          # The metadata file is buildx's own record of what it pushed, which
          # is more reliable than re-inspecting by tag: a concurrent push
          # cannot move it between build and read.
          DIGEST=$(python3 -c "import json;print(json.load(open('/tmp/build-metadata.json'))['containerimage.digest'])")
          echo "digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Prove both architectures are in the published manifest rather than
      # trusting that --platform did what it was asked.
      - name: Assert published manifest covers both architectures
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/blkleg/circuitbreaker:${VERSION}" --raw > /tmp/manifest.json
          python3 - <<'PY'
          import json, sys
          index = json.load(open("/tmp/manifest.json"))
          found = {
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in index.get("manifests", [])
              if "platform" in m and m["platform"].get("architecture") != "unknown"
          }
          required = {"linux/amd64", "linux/arm64"}
          missing = required - found
          if missing:
              print(f"::error::published manifest is missing {sorted(missing)}; found {sorted(found)}")
              sys.exit(1)
          print(f"manifest covers {sorted(found)}")
          PY

      # SEC-18 claims container vulnerability scanning; before this step the
      # pipeline only ever ran `trivy fs`/`config` over the source tree, so the
      # base image and OS packages the image actually ships were never scanned.
      # Placed before cosign so a HIGH/CRIT image is never signed or attested.
      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.docker_push.outputs.digest }}
          format: sarif
          output: trivy-image-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Block on findings that can actually be acted on. A pre-flight scan of
          # the built image measured 109 HIGH/CRIT, of which 4 were fixable — all
          # four are fixed in ffee1414. The other 105 are Debian stable packages
          # (perl-base, zlib1g, libsqlite3-0, util-linux, ncurses) marked
          # affected, fix_deferred or will_not_fix, with no upstream patch to
          # apply. Without this the gate can never pass, and a gate that can
          # never pass gets bypassed instead of obeyed. Any NEW vulnerability
          # that has a fix still fails the release, which is the property worth
          # keeping. The SARIF upload below is unfiltered, so all 105 stay
          # visible in code scanning.
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: '.trivyignore'

      - name: Upload container image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Install cosign v2.4.1
        run: |
          curl -sSfL \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 \
            -o /tmp/cosign
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  /tmp/cosign" | sha256sum -c
          sudo mv /tmp/cosign /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign
          cosign version

      - name: Generate container SBOM
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.docker_push.outputs.digest }}
        run: |
          syft scan "${IMAGE_DIGEST}" \
            --output "cyclonedx-json=dist/release/circuit-breaker_${VERSION}_sbom-container.cdx.json"

      - name: Sign Docker image with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ steps.docker_push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Attach container SBOM to image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.docker_push.outputs.digest }}
        run: |
          cosign attach sbom \
            --sbom "dist/release/circuit-breaker_${VERSION}_sbom-container.cdx.json" \
            --type cyclonedx \
            "${IMAGE_DIGEST}"

      - name: GPG sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY not set — skipping GPG signing"
            exit 0
          fi
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

          cd dist/release/
          for f in *.tar.gz *.deb *.rpm *.apk *.pkg.tar.zst *.AppImage *.json; do
            [ -f "$f" ] && [[ "$f" != *.asc ]] || continue
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${GPG_PASSPHRASE}" \
                --armor --detach-sign "$f"
          done

          # Regenerate SHA256SUMS (now includes .asc + SBOM files) then sign it
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --armor --detach-sign SHA256SUMS

      - name: Remove bundle directory from release artifacts
        run: rm -rf dist/release/bundle

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # setup.sh kept as backward-compat alias for install.sh
          cp install.sh setup.sh
          gh release create "v${VERSION}" \
            --title "Circuit Breaker v${VERSION}" \
            --generate-notes \
            dist/release/* \
            install.sh \
            setup.sh \
            packaging/circuit-breaker-release-key.asc
