name: Build Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # Slice 4.2 (F3): the Ed25519 public key embedded in the agent binaries
      # this build produces. A repository variable, not a secret — it is
      # public by construction, and keeping it out of the secret store lets a
      # fork see which key the official builds use. Empty in a fork, which
      # yields warn-mode agents rather than a failed build.
      signing_pubkey:
        required: false
        type: string
        default: ""
    secrets:
      # The private half, used only by apps/agent/scripts/gen_manifest.py to
      # sign the built binaries. Never read by the application runtime, and
      # absent in forks — which produce unsigned, warn-mode binaries rather
      # than failing.
      AGENT_SIGNING_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: Manual RC/package rebuilds require an operator-supplied version; release.yml consumes the protected artifact path.
    inputs:
      version:
        description: "Version string (e.g. 0.1.3). Defaults to dev-<sha>."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build deps
        run: bash scripts/install-build-deps.sh

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Build frontend
        run: cd apps/frontend && npm ci && npm run build

      - name: Build packages
        env:
          # Signs the cb-agent binaries (apps/agent/scripts/gen_manifest.py)
          # and embeds the matching public key in them
          # (apps/agent/internal/update/signature.go). Both absent in forks
          # and in local builds, which produce warn-mode agents rather than
          # failing.
          AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.AGENT_SIGNING_PRIVATE_KEY }}
          SIGNING_PUBKEY: ${{ inputs.signing_pubkey }}
        run: |
          .venv/bin/python scripts/build_native_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            --clean

      - name: List artifacts
        run: ls -lh dist/native/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.arch }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 7
