name: Dev CI

on:
  push:
    branches: [dev]
  # Without this, a pull request into dev ran no Tier 0 and no Tier 1 — no
  # repo-policy suite, no ruff/mypy/eslint, no ledger validator, no backend
  # shards, no coverage gate. Only pushes to the branch were checked, which is
  # also what .github/branch-protection.md says cannot happen: if direct pushes
  # to dev were blocked, this workflow could never report on the PR that
  # replaced them.
  pull_request:
    branches: [dev]
  # Same reason as ci.yml: re-running the gate against a ref should not require
  # pushing a commit to that ref.
  workflow_dispatch:

permissions:
  contents: read

# Same contract as ci.yml, including the deliberate asymmetry: pull-request runs
# cancel their predecessors, pushes to `dev` do not, because a push run is the
# only evidence that a merged commit was ever green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# REL-20, first half: determinism. Same values and same reasoning as ci.yml —
# PYTHONHASHSEED removes per-process hash salting as a source of run-to-run
# difference, and CB_TEST_SEED is fixed rather than derived from the run id so
# two runs of the same commit are comparable without first reading a log to
# find out what seed each used. Both are copied into every job's run manifest,
# which is uploaded with the rest of that job's evidence.
env:
  PYTHONHASHSEED: "0"
  CB_TEST_SEED: "20260826"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pip's and npm's download caches only — the installs below are unchanged
      # and the lockfiles still decide every version. ci.yml's `lint` job has
      # the full reasoning, including why the key is pyproject.toml.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      - name: Tier 0 — static gates
        env:
          CB_DB_URL: postgresql://cb_ci:cb_ci@127.0.0.1:5432/cb_ci
        run: scripts/ci/tier0-static.sh

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  # ── Tests ─────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    # Ubuntu 24.04 ships PostgreSQL 16 client tools, matching the PostgreSQL
    # 16.2 testcontainer used by tests/conftest.py. Ubuntu 22.04's pg_dump 14
    # cannot dump that server and breaks the real snapshot tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Docker is required, not optional: tests/conftest.py boots a TimescaleDB
    # testcontainer and sets CB_DB_URL from it before any app module is
    # imported, so there is no sqlite-only fallback.
    #
    # The 35+ minute docker e2e suite (apps/agent/e2e) is too slow for the PR
    # path; .github/workflows/e2e.yml runs it nightly and per release tag.
    #
    # REL-20: sharded by file and by blake2b of the path
    # (tests/build/backend_shard.py), so a file lands in the same shard on
    # every run and under any hash seed — "shard 3 failed" names a
    # reproducible set. The coverage ratchet is NOT enforced per shard (a
    # quarter of the suite cannot reach a whole-suite threshold); the
    # `backend-coverage` job below combines the four data files and gates the
    # total.
    strategy:
      # A red shard must not cancel its siblings: cancelling them destroys
      # exactly the evidence needed to tell a shard-local failure from a
      # suite-wide one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
      # One coverage data file per shard, named for it so the four survive
      # being downloaded into a single directory by the gate job below.
      COVERAGE_FILE: ${{ github.workspace }}/artifacts/coverage/.coverage.backend-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      # The endpoint policy/inventory gate (SEC-06/07) reconciles the checked-in
      # inventory against the live route table, and main.py branches on whether
      # a frontend build exists: with one it serves the SPA fallback and mounts
      # /assets and /icons, without one it serves a bare landing page at "/".
      # Testing the backend without building the frontend therefore measures a
      # route surface that no deployment ships, and the gate cannot pass.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Build frontend (route surface under test)
        run: cd apps/frontend && npm ci && npm run build

      - name: Record the run manifest
        run: |
          mkdir -p artifacts/junit artifacts/coverage artifacts/logs artifacts/diagnostics
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=backend-tests"
            echo "shard=${SHARD}/${SHARD_TOTAL}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "python=$(.venv/bin/python -V 2>&1)"
            echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
            echo "docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unavailable)"
            echo "pg_dump=$(pg_dump --version 2>&1)"
          } | tee artifacts/run-manifest.txt

      # The file list is part of the evidence: it is what makes "re-run shard 3
      # locally" a copyable command rather than an archaeology exercise.
      - name: Select this shard's test files
        run: |
          python3 tests/build/backend_shard.py \
            --index "${SHARD}" --total "${SHARD_TOTAL}" > artifacts/shard-files.txt
          echo "shard ${SHARD}/${SHARD_TOTAL}: $(wc -l < artifacts/shard-files.txt) test files"
          cat artifacts/shard-files.txt

      - name: Backend tests
        shell: bash
        run: |
          cd apps/backend
          PYTHONPATH=src ../../.venv/bin/pytest \
            $(cat "${GITHUB_WORKSPACE}/artifacts/shard-files.txt") \
            --junitxml="${GITHUB_WORKSPACE}/artifacts/junit/backend-shard-${SHARD}.xml" \
            --cov-fail-under=0 \
            -p no:cacheprovider \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/backend-shard-${SHARD}.log"

      # Testcontainers reaps its containers through ryuk at session end, so on a
      # clean run this collects little. On a crash or a hang it collects the
      # database the suite was talking to, which is the case the retention rule
      # exists for.
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          docker version > artifacts/diagnostics/docker-version.txt 2>&1 || true
          docker ps -a > artifacts/diagnostics/containers.txt 2>&1 || true
          for container in $(docker ps -aq); do
            docker logs "${container}" > "artifacts/diagnostics/${container}.log" 2>&1 || true
            docker inspect "${container}" > "artifacts/diagnostics/${container}.json" 2>&1 || true
          done
          cp apps/backend/coverage.xml \
            "artifacts/coverage/coverage-shard-${SHARD}.xml" 2>/dev/null || true
          ls -laR artifacts > artifacts/diagnostics/artifact-listing.txt

      # include-hidden-files is load-bearing, not tidiness: the coverage data
      # file is `.coverage.backend-N`, and upload-artifact skips dotfiles by
      # default — without this the combine job below would download four empty
      # directories and the gate would measure nothing.
      - name: Upload backend shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  backend-coverage:
    name: Backend coverage gate
    # No `if: always()`. The ratchet is a statement about a suite that passed;
    # running it over partial data from failed shards would add a second red
    # job saying nothing the first did not. The shard jobs upload their own
    # evidence regardless, so nothing is lost by not running this.
    needs: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Download shard evidence
        uses: actions/download-artifact@v5
        with:
          pattern: backend-shard-*
          path: shards/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine coverage and enforce the ratchet
        shell: bash
        run: |
          mkdir -p artifacts
          find shards -name '.coverage.backend-*' -exec cp {} apps/backend/ \;
          ls -la apps/backend/.coverage.backend-* || {
            echo "::error::no coverage data was retained by the backend shards"
            exit 1
          }
          cd apps/backend
          # Read the threshold out of the same file pytest reads it from. A
          # literal here would be a second copy of the ratchet, free to drift
          # from the one the local `pytest` run enforces.
          THRESHOLD=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              options = tomllib.load(handle)["tool"]["pytest"]["ini_options"]["addopts"]
          print(next(o.split("=", 1)[1] for o in options if o.startswith("--cov-fail-under=")))
          PY
          )
          echo "combined backend coverage must reach ${THRESHOLD}%"
          ../../.venv/bin/python -m coverage combine
          ../../.venv/bin/python -m coverage xml \
            -o "${GITHUB_WORKSPACE}/artifacts/coverage-backend-combined.xml"
          ../../.venv/bin/python -m coverage report --fail-under="${THRESHOLD}" \
            | tee "${GITHUB_WORKSPACE}/artifacts/coverage-backend-combined.txt"

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-combined
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  # ── Fresh-install migrations ─────────────────────────────────────────────────
  # `alembic upgrade head` against a genuinely empty database — the path every
  # real install takes, and the only place it is exercised. Both pytest
  # conftests build their schema with Base.metadata.create_all() instead.
  #
  # Kept separate from backend-tests because that job shards
  # apps/backend/tests only (tests/integration is invisible to
  # backend_shard.py) and inherits a testcontainer already populated by
  # create_all(). This needs a database it can create, drop and start empty.
  # Artifact Smoke never starts the service, so no migration runs there.
  fresh-install-migrations:
    name: Fresh-install migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cb_ci
          POSTGRES_PASSWORD: cb_ci
          POSTGRES_DB: cb_ci
        ports:
          - 5432:5432
        # Health-gated because the step below gets one attempt: the fixture
        # connects to create its scratch database and fails the job if it
        # cannot, which is the correct behaviour for a real fault and a flake
        # for a container that is merely still booting.
        options: >-
          --health-cmd "pg_isready -U cb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Record the run manifest
        run: |
          mkdir -p artifacts/junit artifacts/logs artifacts/diagnostics
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=fresh-install-migrations"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "python=$(.venv/bin/python -V 2>&1)"
            echo "postgres=postgres:16 (service container)"
            echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
          } | tee artifacts/run-manifest.txt

      # Invoked as `make test-backend` does: from apps/backend with the path
      # passed explicitly, so pytest takes its rootdir from the argument and
      # /pytest.ini governs the run (where `filterwarnings = error` lives).
      #
      # No frontend build, Redis or NATS: the fixture only needs PostgreSQL.
      # CB_ALLOW_DEGRADED_DEPENDENCIES matches the Makefile so importing
      # app.main at collection time does not demand a broker.
      - name: Fresh-install migration chain
        shell: bash
        env:
          CB_TEST_DB_URL: postgresql://cb_ci:cb_ci@127.0.0.1:5432/cb_ci
          CB_ALLOW_DEGRADED_DEPENDENCIES: "true"
          CB_ALLOW_DIRECT_EGRESS: "true"
        run: |
          cd apps/backend
          PYTHONPATH=src ../../.venv/bin/pytest \
            ../../tests/integration/test_fresh_install_migration_chain.py \
            --junitxml="${GITHUB_WORKSPACE}/artifacts/junit/fresh-install-migrations.xml" \
            -p no:cacheprovider \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/fresh-install-migrations.log"

      # What the server still holds after the run. On a failure the scratch
      # database is the thing to look at, and the fixture drops it on the way
      # out, so this records what survived rather than requiring a re-run.
      - name: Collect database diagnostics
        if: always()
        env:
          PGPASSWORD: cb_ci
        run: |
          mkdir -p artifacts/diagnostics
          psql -h 127.0.0.1 -U cb_ci -d postgres -c '\l' \
            > artifacts/diagnostics/databases.txt 2>&1 || true
          docker ps -a > artifacts/diagnostics/containers.txt 2>&1 || true

      - name: Upload fresh-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-install-migrations
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/agent/go.sum

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      - name: Record the run manifest
        run: |
          mkdir -p artifacts/junit artifacts/coverage artifacts/logs
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=test"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "node=$(node -v)"
            echo "go=$(go version)"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
          } | tee artifacts/run-manifest.txt

      # REL-15: thresholds live in vitest.config.ts so a local run fails
      # identically; only the reporter, seed and log destination are added.
      #
      # Not sharded: the v8 coverage thresholds apply per run, so sharding
      # would need --merge-reports to keep the gate honest. Order is already
      # deterministic (sequence.shuffle is off) and the seed is recorded.
      - name: Frontend tests with coverage
        shell: bash
        run: |
          cd apps/frontend
          npx vitest run --coverage \
            --sequence.shuffle=false \
            --sequence.seed="${CB_TEST_SEED}" \
            --reporter=default --reporter=junit \
            --outputFile.junit="${GITHUB_WORKSPACE}/artifacts/junit/frontend.xml" \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/frontend.log"

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 14

      # -race is mandatory: the agent's daemon-startup ordering guarantees are
      # only observable under the race detector. The command stays `make test`
      # so the Makefile remains the one place deciding how the agent is tested;
      # flags arrive via GOFLAGS, scoped so `go vet` does not inherit them.
      # -shuffle=off is the default, stated so it cannot drift unnoticed.
      - name: Agent tests
        shell: bash
        env:
          GOFLAGS: >-
            -shuffle=off
            -covermode=atomic
            -coverprofile=${{ github.workspace }}/artifacts/coverage/agent-coverage.out
            -json
        run: |
          cd apps/agent
          make test 2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/agent-test.json"

      # go test has no JUnit writer and the repo vendors no converter, so the
      # -json stream is turned into one here. Keeping the raw stream as well is
      # deliberate: it carries the interleaved build and race-detector output
      # that a JUnit <failure> body truncates.
      - name: Convert Go results to JUnit
        if: always()
        run: |
          python3 - artifacts/logs/agent-test.json artifacts/junit/agent.xml <<'PY'
          import json, sys, xml.etree.ElementTree as ET

          with open(sys.argv[1], encoding="utf-8") as handle:
              events = [json.loads(line) for line in handle if line.startswith("{")]
          cases = {}
          for event in events:
              if "Test" not in event:
                  continue
              case = cases.setdefault(
                  (event["Package"], event["Test"]), {"output": [], "action": "run", "time": "0"}
              )
              if event["Action"] in ("pass", "fail", "skip"):
                  case["action"] = event["Action"]
                  case["time"] = str(event.get("Elapsed", 0))
              elif event["Action"] == "output":
                  case["output"].append(event.get("Output", ""))
          failures = sum(1 for case in cases.values() if case["action"] == "fail")
          skipped = sum(1 for case in cases.values() if case["action"] == "skip")
          suites = ET.Element("testsuites")
          suite = ET.SubElement(
              suites, "testsuite", name="cb-agent", tests=str(len(cases)),
              failures=str(failures), skipped=str(skipped), errors="0",
          )
          for (package, test), case in sorted(cases.items()):
              node = ET.SubElement(
                  suite, "testcase", classname=package, name=test, time=case["time"]
              )
              text = "".join(case["output"])
              if case["action"] == "fail":
                  ET.SubElement(node, "failure", message="go test reported a failure").text = text[-8000:]
              elif case["action"] == "skip":
                  last = text.strip().splitlines()[-1][:200] if text.strip() else "skipped"
                  ET.SubElement(node, "skipped", message=last)
          ET.ElementTree(suites).write(sys.argv[2], encoding="utf-8", xml_declaration=True)
          print(f"{len(cases)} Go test cases -> {sys.argv[2]} ({failures} failed, {skipped} skipped)")
          PY

      - name: Agent vet
        run: cd apps/agent && go vet ./...

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  # ── Security Gate ─────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      # SECURITY_SCAN_VENV has to match on both steps. security_scan.sh reads
      # it to find its toolchain and provisions the venv itself when it is
      # missing, so a mismatch here does not fail — it just installs twice.
      # This is no longer .venv: on a developer machine that path is the
      # backend environment, and semgrep's pins break it (see the comment in
      # security_scan.sh).
      - name: Install scan tools
        env:
          SECURITY_SCAN_VENV: ${{ runner.temp }}/cb-scanner-venv
        run: |
          python3.12 -m venv "$SECURITY_SCAN_VENV"
          "$SECURITY_SCAN_VENV/bin/pip" install --upgrade pip
          "$SECURITY_SCAN_VENV/bin/pip" install bandit semgrep

      - name: Run security gate (fails on HIGH/CRIT)
        env:
          SECURITY_SCAN_VENV: ${{ runner.temp }}/cb-scanner-venv
        run: ./scripts/security_scan.sh --gate

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-scan-report
          path: security_scan_report.md
          retention-days: 30

  # ── Native Build (amd64 only) ─────────────────────────────────────────────────
  build-native:
    name: Build Native (amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Derive version
        id: ver
        run: echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build deps
        run: bash scripts/install-build-deps.sh

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Build frontend
        run: cd apps/frontend && npm ci && npm run build

      - name: Build packages
        env:
          CB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          .venv/bin/python scripts/build_native_release.py \
            --version "$CB_VERSION" \
            --clean

      - name: List artifacts
        run: ls -lh dist/native/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-packages-amd64
          path: dist/native/
          if-no-files-found: error
          retention-days: 3

  # ── Docker Smoke Build ────────────────────────────────────────────────────────
  build-docker:
    name: Build Docker (smoke test)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Derive version
        id: ver
        run: echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          CB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker build -f Dockerfile.mono \
            -t "circuitbreaker:${CB_VERSION}" \
            .

      - name: Verify agent binaries are baked into the image
        env:
          CB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm --entrypoint sh "circuitbreaker:${CB_VERSION}" \
            -c 'test -s /opt/circuitbreaker/agent-binaries/manifest.json && ls /opt/circuitbreaker/agent-binaries'

      # The image must be STARTED, not just built: a broken entrypoint, failed
      # migration, dying supervisord program, unparseable nginx config or empty
      # frontend bundle are all invisible from outside an unstarted image.
      #
      # Through docker-compose.yml rather than a hand-written `docker run`,
      # because that file is what users get and what install.sh uses —
      # read_only, the tmpfs set, cap_drop/cap_add and the healthcheck are all
      # part of what has to work.

      # Ephemeral, per-run, never stored: the four values compose guards with
      # ${VAR:?}. token_hex for the three opaque ones; the vault needs a real
      # Fernet key (urlsafe base64 of 32 bytes) or it rejects it at startup.
      #
      # ::add-mask:: is registered before the values are written anywhere, so a
      # later step dumping the environment is redacted rather than leaked.
      - name: Mint ephemeral secrets for the smoke run
        env:
          CB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          hexgen() { python3 -c 'import secrets; print(secrets.token_hex(32))'; }
          DB_PASSWORD="$(hexgen)"
          JWT_SECRET="$(hexgen)"
          NATS_TOKEN="$(hexgen)"
          VAULT_KEY="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          for secret in "${DB_PASSWORD}" "${JWT_SECRET}" "${NATS_TOKEN}" "${VAULT_KEY}"; do
            echo "::add-mask::${secret}"
          done

          # printf per line rather than a heredoc: the values are written
          # verbatim with no chance of picking up the block's indentation.
          umask 077
          {
            printf 'CB_DB_PASSWORD=%s\n' "${DB_PASSWORD}"
            printf 'CB_JWT_SECRET=%s\n' "${JWT_SECRET}"
            printf 'NATS_AUTH_TOKEN=%s\n' "${NATS_TOKEN}"
            printf 'CB_VAULT_KEY=%s\n' "${VAULT_KEY}"
            printf 'CB_IMAGE=circuitbreaker:%s\n' "${CB_VERSION}"
            # Not 80/443: the runner already has services on the low ports, and
            # a bind failure here would read as a container fault.
            printf 'CB_PORT=%s\n' "18080"
            printf 'CB_PORT_HTTPS=%s\n' "18443"
            printf 'CB_DATA_DIR=%s\n' "${RUNNER_TEMP}/cb-smoke-data"
          } > .env
          echo "wrote .env with $(wc -l < .env) settings (values masked)"

      - name: Start the image through docker-compose.yml
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cb-smoke-data"
          # No --build: the image under test is the one the step above tagged,
          # and CB_IMAGE points compose at it. Letting compose build would test
          # a second, differently-cached image.
          docker compose -f docker-compose.yml up -d
          docker compose -f docker-compose.yml ps

      # The probe is character-for-character the one in the compose healthcheck
      # and in Dockerfile.mono, including the grep. That is not redundancy: the
      # :8080 server block 301-redirects anything it does not proxy, and
      # `curl -f` treats a 301 as success, so a status-only probe passes against
      # a container whose backend never started. Matching "alive" in the body is
      # what makes this an assertion about the application.
      - name: Wait for /livez
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 4 http://127.0.0.1:18080/api/v1/livez | grep -q '"alive"'; then
              echo "live after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::container never reported live within 300s"
          exit 1

      # Separate from /livez with its own budget: live-but-never-ready is a
      # dependency that did not come up, never-live is the process itself, and
      # the distinction is the diagnosis. Dockerfile.mono healthchecks only
      # /livez so a slow dependency cannot cause a restart loop — right for the
      # runtime, wrong for a gate, so readiness is asserted here.
      - name: Wait for /readyz
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code="$(curl -s -o /tmp/readyz.json -w '%{http_code}' --max-time 5 http://127.0.0.1:18080/api/v1/readyz || true)"
            if [ "${code}" = "200" ]; then
              echo "ready after ${attempt} attempt(s)"
              cat /tmp/readyz.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::container never became ready within 180s; last /readyz body:"
          cat /tmp/readyz.json 2>/dev/null || echo "(no response body)"
          exit 1

      # The mono image does not serve the SPA over HTTP at all: nginx.mono.conf's
      # :8080 block proxies only the health endpoints and the ACME challenge,
      # and its `location /` is `return 301 https://$host$uri`. The SPA lives in
      # the :8443 block. So probe HTTP for the redirect and HTTPS for the app.
      #
      # The redirect is asserted, never followed — pushing non-health traffic to
      # TLS is a security control, and a silent -L would let its removal pass.
      - name: Assert plain HTTP redirects to TLS
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18080/)"
          [ "${code}" = "301" ] \
            || { echo "::error::GET / over HTTP returned ${code}, expected a 301 to HTTPS"; exit 1; }
          echo "HTTP -> HTTPS redirect in place"

      # -k because entrypoint-mono.sh generates a self-signed certificate on
      # first boot when /data/tls is empty, which is exactly the state a fresh
      # container is in. The assertion is about nginx and the frontend bundle,
      # not about the trust chain.
      #
      # A 200 alone is not enough: an image whose Alpine builder stage produced
      # no bundle would still answer, so the SPA shell is what is checked.
      - name: Assert nginx serves the frontend over TLS
        run: |
          set -euo pipefail
          code="$(curl -sk -o /tmp/index.html -w '%{http_code}' --max-time 10 https://127.0.0.1:18443/)"
          [ "${code}" = "200" ] || { echo "::error::GET / over HTTPS returned HTTP ${code}, expected 200"; exit 1; }
          grep -qi '<div id="root"' /tmp/index.html \
            || { echo "::error::GET / returned 200 but not the SPA shell"; head -c 400 /tmp/index.html; exit 1; }
          echo "frontend served over TLS"

      # supervisord is the only thing that knows whether the other twelve
      # processes are alive. Every program in supervisord.mono.conf is
      # long-running with autorestart=true, so FATAL, BACKOFF or EXITED all mean
      # something died — and with the API answering on :8080, a dead telemetry
      # or monitor worker is invisible to every probe above it.
      - name: Assert every supervisord program is running
        run: |
          set -euo pipefail
          # The same -c the entrypoint execs supervisord with. `|| true`
          # because `supervisorctl status` exits non-zero when any program is
          # not RUNNING, which is the case this step exists to report rather
          # than to abort on — the assertions below read the output instead.
          docker compose -f docker-compose.yml exec -T circuitbreaker \
            supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status \
            | tee /tmp/supervisor-status.txt || true

          # Assert state, never a process count: `numprocs` means the number of
          # processes does not match the number of [program:] sections, and any
          # hardcoded total breaks the next time either changes.
          #
          # Reading the state column is stricter than grepping for FATAL — an
          # unanticipated STOPPED, or a STARTING that never settles, fails here
          # too. Retried, because /readyz answering does not mean every worker
          # has finished starting.
          all_running=""
          for attempt in $(seq 1 6); do
            docker compose -f docker-compose.yml exec -T circuitbreaker \
              supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status \
              > /tmp/supervisor-status.txt 2>&1 || true
            not_running="$(awk 'NF && $2 != "RUNNING" {print}' /tmp/supervisor-status.txt)"
            if [ -z "${not_running}" ]; then
              all_running="yes"
              break
            fi
            echo "attempt ${attempt}: not yet all RUNNING"
            sleep 5
          done
          cat /tmp/supervisor-status.txt

          if [ -z "${all_running}" ]; then
            echo "::error::a supervisord program is not RUNNING"
            awk 'NF && $2 != "RUNNING" {print}' /tmp/supervisor-status.txt
            exit 1
          fi

          # Non-vacuous guard. With `|| true` above, an exec that failed outright
          # leaves an empty file — and every assertion over an empty file passes,
          # including the one immediately above. These five are the processes
          # without which the container is not the product, so requiring them by
          # name proves the status was actually read.
          for proc in postgres nats redis backend-api nginx; do
            grep -Eq "^${proc}[[:space:]]" /tmp/supervisor-status.txt \
              || { echo "::error::supervisorctl did not report ${proc}"; exit 1; }
          done
          echo "all supervisord programs running"

      # A container that crashed and was restarted back into health passes every
      # probe above. RestartCount is what separates "came up" from "kept coming
      # up": restart is `unless-stopped`, so anything above zero is a boot the
      # image did not survive.
      - name: Assert the container never restarted
        run: |
          set -euo pipefail
          restarts="$(docker inspect -f '{{.RestartCount}}' circuitbreaker)"
          echo "RestartCount=${restarts}"
          [ "${restarts}" = "0" ] || { echo "::error::container restarted ${restarts} time(s) during the smoke run"; exit 1; }

      # `stop`, not `down`, and its own step: a container that ignores SIGTERM is
      # stopped by SIGKILL ten seconds later, which users experience as a
      # `docker compose down` that hangs and, with an embedded Postgres, as an
      # unclean shutdown. Timing the stop is how that becomes visible here.
      - name: Assert the container stops on SIGTERM
        run: |
          set -euo pipefail
          start="${SECONDS}"
          docker compose -f docker-compose.yml stop -t 30
          elapsed="$(( SECONDS - start ))"
          echo "stopped in ${elapsed}s"
          [ "${elapsed}" -lt 30 ] || { echo "::error::container did not exit on SIGTERM; it was killed after ${elapsed}s"; exit 1; }

      # if: always() — the run that most needs its logs is the one that failed
      # before reaching the step that would have collected them.
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          docker compose -f docker-compose.yml ps -a > artifacts/diagnostics/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.yml logs --no-color --timestamps \
            > artifacts/diagnostics/container.log 2>&1 || true
          docker inspect circuitbreaker > artifacts/diagnostics/inspect.json 2>&1 || true
          cp /tmp/supervisor-status.txt artifacts/diagnostics/ 2>/dev/null || true
          cp /tmp/readyz.json artifacts/diagnostics/ 2>/dev/null || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-diagnostics
          path: artifacts/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # The .env holds four live secrets. They are ephemeral and single-run, but
      # the workspace is not guaranteed to be discarded before another step
      # reads it, and `docker compose down -v` needs the file to resolve the
      # project. Teardown first, then remove it, always.
      - name: Tear down and shred the smoke secrets
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v --remove-orphans || true
          shred -u .env 2>/dev/null || rm -f .env
          sudo rm -rf "${RUNNER_TEMP}/cb-smoke-data" || true

  # ── Browser E2E ──────────────────────────────────────────────────────────────
  # Ported from ci.yml, verbatim apart from this comment. It was main-only, so
  # every UI regression reached `dev` unmeasured and was found by the `main` PR
  # that carried a fortnight of them at once — the branch that receives the work
  # is the branch where a bisect is cheap.
  browser-e2e:
    name: Browser E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Pinned to the Playwright image so rendering matches the container the
    # REL-18 visual baselines are generated in. A version skew between this tag
    # and the @playwright/test version in package.json shows up as
    # unexplainable screenshot diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Steps in a container run as root, but the runner mounts $HOME at
    # /github/home owned by the image's `pwuser`. Firefox refuses to start in
    # that situation ("Running Nightly as root in a regular user's session is
    # not supported"); /root is root's own directory, so the check succeeds.
    # Nothing in this job needs $HOME to persist.
    env:
      HOME: /root
    # REL-20: Playwright's --shard is deterministic by construction — it sorts
    # the test list and slices it — so shard N holds the same specs on every
    # run. Two shards, not four: each one still pays the production build in
    # playwright.config.ts's webServer, so the split stops paying for itself
    # quickly.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      # No `cache: npm` here, unlike every other job. This one runs inside the
      # Playwright container with HOME forced to /root (see above), so the npm
      # cache directory the cache step would save is not the one the runner
      # restores into on the next run, and the mismatch is silent — a cache
      # that never hits costs an upload per shard and saves nothing. The
      # container is the reason this job exists; keeping its dependency install
      # honest is worth more than the cache.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      - name: Record the run manifest
        run: |
          mkdir -p artifacts
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=browser-e2e"
            echo "shard=${{ matrix.shard }}/${{ strategy.job-total }}"
            echo "image=mcr.microsoft.com/playwright:v1.63.0-noble"
            echo "node=$(node -v)"
            echo "playwright=$(cd apps/frontend && npx playwright --version)"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
          } | tee artifacts/run-manifest.txt

      # The visual-* projects carry the REL-18 baselines (committed 2026-08-19,
      # see docs/testing-visual-baselines.md). They are separate projects so a
      # stale baseline fails the visual gate and not the functional one;
      # playwright.config.ts keeps visual.spec.ts out of the other four.
      - name: Run Playwright suite
        shell: bash
        run: |
          cd apps/frontend
          npx playwright test \
            --shard="${{ matrix.shard }}/${{ strategy.job-total }}" \
            --project=chromium \
            --project=firefox \
            --project=webkit \
            --project=mobile-chrome \
            --project=visual-desktop \
            --project=visual-mobile \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/playwright.log"

      # REL-20: a failed job must be diagnosable from retained artifacts alone.
      # playwright.config.ts already writes the JUnit report and keeps traces,
      # screenshots and video on failure; test-results/ is where those land, so
      # the two paths below cover every artifact class this job produces.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

  # ── Browser E2E aggregate ────────────────────────────────────────────────────
  # The stable check-run name branch protection can require.
  #
  # A matrix produces `Browser E2E (shard 1/2)` and `(shard 2/2)`, never a bare
  # `Browser E2E`. Requiring the shard names instead would couple the branch
  # settings to the shard count: adding a third silently stops enforcing it,
  # because a required check that no longer exists blocks merges while a new one
  # nobody required does not. This job's value is entirely in `needs` and the
  # assertion below.
  browser-e2e-gate:
    name: Browser E2E
    needs: browser-e2e
    # Required, and the whole point. Without it this job is skipped whenever a
    # shard fails, and GitHub counts a skipped required check as satisfied — so
    # the aggregate would turn red shards green, which is worse than the naming
    # bug it replaces. `always()` makes it run regardless, and the step decides.
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Assert every Playwright shard passed
        env:
          # The matrix's combined result: `success` only when every leg
          # succeeded, `failure` if any leg failed, and `skipped`/`cancelled`
          # for the cases that must not read as a pass either.
          SHARDS_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          echo "browser-e2e matrix result: ${SHARDS_RESULT}"
          if [ "${SHARDS_RESULT}" != "success" ]; then
            echo "::error::browser E2E did not pass (matrix result: ${SHARDS_RESULT})"
            exit 1
          fi
          echo "all Playwright shards passed"
