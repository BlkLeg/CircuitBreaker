name: Dev CI

on:
  push:
    branches: [dev]
  # Without this, a pull request into dev ran no Tier 0 and no Tier 1 — no
  # repo-policy suite, no ruff/mypy/eslint, no ledger validator, no backend
  # shards, no coverage gate. Only pushes to the branch were checked, which is
  # also what .github/branch-protection.md says cannot happen: if direct pushes
  # to dev were blocked, this workflow could never report on the PR that
  # replaced them.
  pull_request:
    branches: [dev]
  # Same reason as ci.yml: re-running the gate against a ref should not require
  # pushing a commit to that ref.
  workflow_dispatch:

permissions:
  contents: read

# Same contract as ci.yml, including the deliberate asymmetry: pull-request runs
# cancel their predecessors, pushes to `dev` do not, because a push run is the
# only evidence that a merged commit was ever green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# REL-20, first half: determinism. Same values and same reasoning as ci.yml —
# PYTHONHASHSEED removes per-process hash salting as a source of run-to-run
# difference, and CB_TEST_SEED is fixed rather than derived from the run id so
# two runs of the same commit are comparable without first reading a log to
# find out what seed each used. Both are copied into every job's run manifest,
# which is uploaded with the rest of that job's evidence.
env:
  PYTHONHASHSEED: "0"
  CB_TEST_SEED: "20260826"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pip's and npm's download caches only — the installs below are unchanged
      # and the lockfiles still decide every version. ci.yml's `lint` job has
      # the full reasoning, including why the key is pyproject.toml.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      # tests/build checks the CLI's installed dependency tree for install-time
      # scripts (NPM-10), so Tier 0 needs it; --ignore-scripts for the same reason.
      - name: Install CLI deps
        run: cd packages/cli && npm ci --ignore-scripts

      - name: Tier 0 — static gates
        env:
          CB_DB_URL: postgresql://cb_ci:cb_ci@127.0.0.1:5432/cb_ci
        run: scripts/ci/tier0-static.sh

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  # ── Tests ─────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    # Ubuntu 24.04 ships PostgreSQL 16 client tools, matching the PostgreSQL
    # 16.2 testcontainer used by tests/conftest.py. Ubuntu 22.04's pg_dump 14
    # cannot dump that server and breaks the real snapshot tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Docker is required, not optional: tests/conftest.py boots a TimescaleDB
    # testcontainer and sets CB_DB_URL from it before any app module is
    # imported, so there is no sqlite-only fallback.
    #
    # The 35+ minute docker e2e suite (apps/agent/e2e) is too slow for the PR
    # path; .github/workflows/e2e.yml runs it nightly and per release tag.
    #
    # REL-20: sharded by file and by blake2b of the path
    # (tests/build/backend_shard.py), so a file lands in the same shard on
    # every run and under any hash seed — "shard 3 failed" names a
    # reproducible set. The coverage ratchet is NOT enforced per shard (a
    # quarter of the suite cannot reach a whole-suite threshold); the
    # `backend-coverage` job below combines the four data files and gates the
    # total.
    strategy:
      # A red shard must not cancel its siblings: cancelling them destroys
      # exactly the evidence needed to tell a shard-local failure from a
      # suite-wide one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
      # One coverage data file per shard, named for it so the four survive
      # being downloaded into a single directory by the gate job below.
      COVERAGE_FILE: ${{ github.workspace }}/artifacts/coverage/.coverage.backend-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      # The endpoint policy/inventory gate (SEC-06/07) reconciles the checked-in
      # inventory against the live route table, and main.py branches on whether
      # a frontend build exists: with one it serves the SPA fallback and mounts
      # /assets and /icons, without one it serves a bare landing page at "/".
      # Testing the backend without building the frontend therefore measures a
      # route surface that no deployment ships, and the gate cannot pass.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Build frontend (route surface under test)
        run: cd apps/frontend && npm ci && npm run build

      - name: Record the run manifest
        run: |
          mkdir -p artifacts/junit artifacts/coverage artifacts/logs artifacts/diagnostics
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=backend-tests"
            echo "shard=${SHARD}/${SHARD_TOTAL}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "python=$(.venv/bin/python -V 2>&1)"
            echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
            echo "docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unavailable)"
            echo "pg_dump=$(pg_dump --version 2>&1)"
          } | tee artifacts/run-manifest.txt

      # The file list is part of the evidence: it is what makes "re-run shard 3
      # locally" a copyable command rather than an archaeology exercise.
      - name: Select this shard's test files
        run: |
          python3 tests/build/backend_shard.py \
            --index "${SHARD}" --total "${SHARD_TOTAL}" > artifacts/shard-files.txt
          echo "shard ${SHARD}/${SHARD_TOTAL}: $(wc -l < artifacts/shard-files.txt) test files"
          cat artifacts/shard-files.txt

      - name: Backend tests
        shell: bash
        run: |
          cd apps/backend
          PYTHONPATH=src ../../.venv/bin/pytest \
            $(cat "${GITHUB_WORKSPACE}/artifacts/shard-files.txt") \
            --junitxml="${GITHUB_WORKSPACE}/artifacts/junit/backend-shard-${SHARD}.xml" \
            --cov-fail-under=0 \
            -p no:cacheprovider \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/backend-shard-${SHARD}.log"

      # Testcontainers reaps its containers through ryuk at session end, so on a
      # clean run this collects little. On a crash or a hang it collects the
      # database the suite was talking to, which is the case the retention rule
      # exists for.
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          docker version > artifacts/diagnostics/docker-version.txt 2>&1 || true
          docker ps -a > artifacts/diagnostics/containers.txt 2>&1 || true
          for container in $(docker ps -aq); do
            docker logs "${container}" > "artifacts/diagnostics/${container}.log" 2>&1 || true
            docker inspect "${container}" > "artifacts/diagnostics/${container}.json" 2>&1 || true
          done
          cp apps/backend/coverage.xml \
            "artifacts/coverage/coverage-shard-${SHARD}.xml" 2>/dev/null || true
          ls -laR artifacts > artifacts/diagnostics/artifact-listing.txt

      # include-hidden-files is load-bearing, not tidiness: the coverage data
      # file is `.coverage.backend-N`, and upload-artifact skips dotfiles by
      # default — without this the combine job below would download four empty
      # directories and the gate would measure nothing.
      - name: Upload backend shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  backend-coverage:
    name: Backend coverage gate
    # No `if: always()`. The ratchet is a statement about a suite that passed;
    # running it over partial data from failed shards would add a second red
    # job saying nothing the first did not. The shard jobs upload their own
    # evidence regardless, so nothing is lost by not running this.
    needs: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Download shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: backend-shard-*
          path: shards/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine coverage and enforce the ratchet
        shell: bash
        run: |
          mkdir -p artifacts
          find shards -name '.coverage.backend-*' -exec cp {} apps/backend/ \;
          ls -la apps/backend/.coverage.backend-* || {
            echo "::error::no coverage data was retained by the backend shards"
            exit 1
          }
          cd apps/backend
          # Read the threshold out of the same file pytest reads it from. A
          # literal here would be a second copy of the ratchet, free to drift
          # from the one the local `pytest` run enforces.
          THRESHOLD=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              options = tomllib.load(handle)["tool"]["pytest"]["ini_options"]["addopts"]
          print(next(o.split("=", 1)[1] for o in options if o.startswith("--cov-fail-under=")))
          PY
          )
          echo "combined backend coverage must reach ${THRESHOLD}%"
          ../../.venv/bin/python -m coverage combine
          ../../.venv/bin/python -m coverage xml \
            -o "${GITHUB_WORKSPACE}/artifacts/coverage-backend-combined.xml"
          ../../.venv/bin/python -m coverage report --fail-under="${THRESHOLD}" \
            | tee "${GITHUB_WORKSPACE}/artifacts/coverage-backend-combined.txt"

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-combined
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  # ── Fresh-install migrations ─────────────────────────────────────────────────
  # `alembic upgrade head` against a genuinely empty database — the path every
  # real install takes, and the only place it is exercised. Both pytest
  # conftests build their schema with Base.metadata.create_all() instead.
  #
  # Kept separate from backend-tests because that job shards
  # apps/backend/tests only (tests/integration is invisible to
  # backend_shard.py) and inherits a testcontainer already populated by
  # create_all(). This needs a database it can create, drop and start empty.
  # Artifact Smoke never starts the service, so no migration runs there.
  fresh-install-migrations:
    name: Fresh-install migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cb_ci
          POSTGRES_PASSWORD: cb_ci
          POSTGRES_DB: cb_ci
        ports:
          - 5432:5432
        # Health-gated because the step below gets one attempt: the fixture
        # connects to create its scratch database and fails the job if it
        # cannot, which is the correct behaviour for a real fault and a flake
        # for a container that is merely still booting.
        options: >-
          --health-cmd "pg_isready -U cb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Record the run manifest
        run: |
          mkdir -p artifacts/junit artifacts/logs artifacts/diagnostics
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=fresh-install-migrations"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "python=$(.venv/bin/python -V 2>&1)"
            echo "postgres=postgres:16 (service container)"
            echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
          } | tee artifacts/run-manifest.txt

      # Invoked as `make test-backend` does: from apps/backend with the path
      # passed explicitly, so pytest takes its rootdir from the argument and
      # /pytest.ini governs the run (where `filterwarnings = error` lives).
      #
      # No frontend build, Redis or NATS: the fixture only needs PostgreSQL.
      # CB_ALLOW_DEGRADED_DEPENDENCIES matches the Makefile so importing
      # app.main at collection time does not demand a broker.
      - name: Fresh-install migration chain
        shell: bash
        env:
          CB_TEST_DB_URL: postgresql://cb_ci:cb_ci@127.0.0.1:5432/cb_ci
          CB_ALLOW_DEGRADED_DEPENDENCIES: "true"
          CB_ALLOW_DIRECT_EGRESS: "true"
        run: |
          cd apps/backend
          PYTHONPATH=src ../../.venv/bin/pytest \
            ../../tests/integration/test_fresh_install_migration_chain.py \
            --junitxml="${GITHUB_WORKSPACE}/artifacts/junit/fresh-install-migrations.xml" \
            -p no:cacheprovider \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/fresh-install-migrations.log"

      # What the server still holds after the run. On a failure the scratch
      # database is the thing to look at, and the fixture drops it on the way
      # out, so this records what survived rather than requiring a re-run.
      - name: Collect database diagnostics
        if: always()
        env:
          PGPASSWORD: cb_ci
        run: |
          mkdir -p artifacts/diagnostics
          psql -h 127.0.0.1 -U cb_ci -d postgres -c '\l' \
            > artifacts/diagnostics/databases.txt 2>&1 || true
          docker ps -a > artifacts/diagnostics/containers.txt 2>&1 || true

      - name: Upload fresh-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-install-migrations
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/agent/go.sum

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      - name: Record the run manifest
        run: |
          mkdir -p artifacts/junit artifacts/coverage artifacts/logs
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=test"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "node=$(node -v)"
            echo "go=$(go version)"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
          } | tee artifacts/run-manifest.txt

      # REL-15: thresholds live in vitest.config.ts so a local run fails
      # identically; only the reporter, seed and log destination are added.
      #
      # Not sharded: the v8 coverage thresholds apply per run, so sharding
      # would need --merge-reports to keep the gate honest. Order is already
      # deterministic (sequence.shuffle is off) and the seed is recorded.
      - name: Frontend tests with coverage
        shell: bash
        run: |
          cd apps/frontend
          npx vitest run --coverage \
            --sequence.shuffle=false \
            --sequence.seed="${CB_TEST_SEED}" \
            --reporter=default --reporter=junit \
            --outputFile.junit="${GITHUB_WORKSPACE}/artifacts/junit/frontend.xml" \
            2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/frontend.log"

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 14

      # -race is mandatory: the agent's daemon-startup ordering guarantees are
      # only observable under the race detector. The command stays `make test`
      # so the Makefile remains the one place deciding how the agent is tested;
      # flags arrive via GOFLAGS, scoped so `go vet` does not inherit them.
      # -shuffle=off is the default, stated so it cannot drift unnoticed.
      - name: Agent tests
        shell: bash
        env:
          GOFLAGS: >-
            -shuffle=off
            -covermode=atomic
            -coverprofile=${{ github.workspace }}/artifacts/coverage/agent-coverage.out
            -json
        run: |
          cd apps/agent
          make test 2>&1 | tee "${GITHUB_WORKSPACE}/artifacts/logs/agent-test.json"

      # go test has no JUnit writer and the repo vendors no converter, so the
      # -json stream is turned into one here. Keeping the raw stream as well is
      # deliberate: it carries the interleaved build and race-detector output
      # that a JUnit <failure> body truncates.
      - name: Convert Go results to JUnit
        if: always()
        run: |
          python3 - artifacts/logs/agent-test.json artifacts/junit/agent.xml <<'PY'
          import json, sys, xml.etree.ElementTree as ET

          with open(sys.argv[1], encoding="utf-8") as handle:
              events = [json.loads(line) for line in handle if line.startswith("{")]
          cases = {}
          for event in events:
              if "Test" not in event:
                  continue
              case = cases.setdefault(
                  (event["Package"], event["Test"]), {"output": [], "action": "run", "time": "0"}
              )
              if event["Action"] in ("pass", "fail", "skip"):
                  case["action"] = event["Action"]
                  case["time"] = str(event.get("Elapsed", 0))
              elif event["Action"] == "output":
                  case["output"].append(event.get("Output", ""))
          failures = sum(1 for case in cases.values() if case["action"] == "fail")
          skipped = sum(1 for case in cases.values() if case["action"] == "skip")
          suites = ET.Element("testsuites")
          suite = ET.SubElement(
              suites, "testsuite", name="cb-agent", tests=str(len(cases)),
              failures=str(failures), skipped=str(skipped), errors="0",
          )
          for (package, test), case in sorted(cases.items()):
              node = ET.SubElement(
                  suite, "testcase", classname=package, name=test, time=case["time"]
              )
              text = "".join(case["output"])
              if case["action"] == "fail":
                  ET.SubElement(node, "failure", message="go test reported a failure").text = text[-8000:]
              elif case["action"] == "skip":
                  last = text.strip().splitlines()[-1][:200] if text.strip() else "skipped"
                  ET.SubElement(node, "skipped", message=last)
          ET.ElementTree(suites).write(sys.argv[2], encoding="utf-8", xml_declaration=True)
          print(f"{len(cases)} Go test cases -> {sys.argv[2]} ({failures} failed, {skipped} skipped)")
          PY

      - name: Agent vet
        run: cd apps/agent && go vet ./...

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  npm-cli:
    name: npm CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: node --test packages/cli/test/*.test.js

      - name: Packed-tarball smoke
        run: scripts/ci/cli_packed_smoke.sh

  # ── Security Gate ─────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      # SECURITY_SCAN_VENV has to match on both steps. security_scan.sh reads
      # it to find its toolchain and provisions the venv itself when it is
      # missing, so a mismatch here does not fail — it just installs twice.
      # This is no longer .venv: on a developer machine that path is the
      # backend environment, and semgrep's pins break it (see the comment in
      # security_scan.sh).
      - name: Install scan tools
        env:
          SECURITY_SCAN_VENV: ${{ runner.temp }}/cb-scanner-venv
        run: |
          python3.12 -m venv "$SECURITY_SCAN_VENV"
          "$SECURITY_SCAN_VENV/bin/pip" install --upgrade pip
          "$SECURITY_SCAN_VENV/bin/pip" install bandit semgrep

      - name: Run security gate (fails on HIGH/CRIT)
        env:
          SECURITY_SCAN_VENV: ${{ runner.temp }}/cb-scanner-venv
        run: ./scripts/security_scan.sh --gate

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-scan-report
          path: security_scan_report.md
          retention-days: 30

  # ── Native Build (amd64 only) ─────────────────────────────────────────────────
  build-native:
    name: Build Native (amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # Published so `artifact-smoke` below can install the candidate this job
    # built rather than re-deriving the version string and hoping the two agree.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # The tree's own VERSION, not `dev-<sha>`. The bundle copies VERSION into
      # share/VERSION and the binary answers --version from it, so a build named
      # anything else produces a package that contradicts itself — and the
      # artifact-smoke contract below compares exactly those two values.
      # scripts/build_native_release.py now refuses the mismatch outright.
      # What distinguishes one dev candidate from another is the run id and the
      # artifact name, not a version string the artifact cannot carry.
      - name: Derive version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install build deps
        run: bash scripts/install-build-deps.sh

      - name: Install Python deps
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "apps/backend/[dev]"

      - name: Build frontend
        run: cd apps/frontend && npm ci && npm run build

      - name: Build packages
        env:
          CB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          .venv/bin/python scripts/build_native_release.py \
            --version "$CB_VERSION" \
            --clean

      - name: List artifacts
        run: ls -lh dist/native/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-packages-amd64
          path: dist/native/
          if-no-files-found: error
          retention-days: 3

  # ── Installed-artifact gate, on the integration branch ───────────────────────
  # The same workflow release.yml calls, against the candidate build-native just
  # produced: install the .deb, prove the binary contains its application, boot
  # the unit, reach /livez and /readyz, confirm migrations ran, make an
  # authenticated API request, and uninstall.
  #
  # This job is the answer to "a release was the first execution of the artifact
  # path". Before it, artifact-smoke.yml ran only from a tag push, so every
  # defect in it — and every packaging defect it covers — first surfaced during
  # a release. v0.4.2 shipped an application-less binary and v0.4.3's release
  # died in `Initialize containers`, both for that reason.
  #
  # amd64 only: build-native builds one architecture. The arm64 legs stay on the
  # release path, where build.yml produces them.
  # tests/build/test_release_paths_run_before_the_tag.py keeps this wired.
  artifact-smoke:
    name: Artifact Smoke
    needs: build-native
    uses: ./.github/workflows/artifact-smoke.yml
    with:
      version: ${{ needs.build-native.outputs.version }}
      artifact_prefix: dev-packages
      arches: '["amd64"]'

  # The mono image's build, compose smoke and publish live in mono-smoke.yml
  # (Tier 2 slice A3), shared with tier2.yml and the release. The push stays in
  # the same job as the smoke that started the image; this caller's
  # packages: write is what lets it happen, and only on a push to dev (the
  # step's own `if:`). Pull requests build and smoke the same way and never push.
  build-docker:
    name: Build Docker (smoke test)
    needs: [artifact-smoke]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mono-smoke.yml
    with:
      publish: true
      provenance_artifact: dev-image-build-info-amd64

  # ── The image and the package are the same application ─────────────────────
  # D7 of the 2026-09-22 design: the mono image rebuilds the tree from the same
  # pins the native build uses, and this is where "the same" is asserted rather
  # than assumed. A pin edited in one place, a requirement file the image does
  # not copy, or a pruning difference all fail here, before a release.
  runtime-parity:
    name: Runtime parity (image == package)
    needs: [build-native, build-docker]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dev-packages-amd64
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: dev-image-build-info-amd64
          path: image-info/
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare provenance
        env:
          VERSION: ${{ needs.build-native.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar -xzf "dist/circuit-breaker_${VERSION}_linux_amd64.tar.gz" -C unpacked share/build-info.json
          python3 scripts/ci/assert_runtime_parity.py unpacked/share/build-info.json image-info/build-info.json

  # ── Browser E2E ──────────────────────────────────────────────────────────────
  # Runs here as well as on `main`: it was main-only once, so every UI
  # regression reached `dev` unmeasured and was found by the `main` PR that
  # carried a fortnight of them at once — the branch that receives the work is
  # the branch where a bisect is cheap.
  #
  # The suite itself lives in browser-e2e.yml, shared with ci.yml and
  # release.yml, so the three callers cannot drift apart. The aggregate below
  # stays here: a called workflow's jobs report as `<caller> / <job>`, so
  # hosting it there would rename the `Browser E2E` check run this job exists
  # to keep stable.
  browser-e2e:
    uses: ./.github/workflows/browser-e2e.yml

  # ── Browser E2E aggregate ────────────────────────────────────────────────────
  # The stable check-run name branch protection can require.
  #
  # A matrix produces `Browser E2E (shard 1/2)` and `(shard 2/2)`, never a bare
  # `Browser E2E`. Requiring the shard names instead would couple the branch
  # settings to the shard count: adding a third silently stops enforcing it,
  # because a required check that no longer exists blocks merges while a new one
  # nobody required does not. This job's value is entirely in `needs` and the
  # assertion below.
  browser-e2e-gate:
    name: Browser E2E
    needs: browser-e2e
    # Required, and the whole point. Without it this job is skipped whenever a
    # shard fails, and GitHub counts a skipped required check as satisfied — so
    # the aggregate would turn red shards green, which is worse than the naming
    # bug it replaces. `always()` makes it run regardless, and the step decides.
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Assert every Playwright shard passed
        env:
          # The matrix's combined result: `success` only when every leg
          # succeeded, `failure` if any leg failed, and `skipped`/`cancelled`
          # for the cases that must not read as a pass either.
          SHARDS_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          echo "browser-e2e matrix result: ${SHARDS_RESULT}"
          if [ "${SHARDS_RESULT}" != "success" ]; then
            echo "::error::browser E2E did not pass (matrix result: ${SHARDS_RESULT})"
            exit 1
          fi
          echo "all Playwright shards passed"
