name: Browser E2E

# The Playwright suite, defined once and called by everything that needs it.
#
# It lived inline in ci.yml and dev-ci.yml, and the release needed a third
# caller. Three copies of a job pinned to a container tag that must move in
# lockstep with `@playwright/test` is the drift class
# tests/build/test_playwright_image_matches_package.py already exists to catch,
# so the job moved here rather than being copied again.
#
# Why release.yml calls it: `make verify` and `make verify-full` run no browser
# at all, and until now neither did the release. The release gates cover
# packaging — artifact-smoke, installer-journey, runtime-parity — so a frontend
# regression could reach a published tag with nothing having rendered a page.
# Browser E2E is not a required check on `main` either, so a red Playwright run
# blocks no merge; gating the candidate on it is what makes the suite load
# bearing for a release.
#
# What this does NOT cover: the composed agent journey. e2e.yml calls
# composed-e2e.yml but is quarantined (QUAR-001, issue #162, expiring
# 2026-12-21) — the discovery bootstrap never creates its system-managed
# profiles, so all three tests time out. Wiring it in here would make every
# release red. When that quarantine clears, flipping `quarantined: false` on
# e2e.yml's call is the remaining gap to close, the same way this one was.
#
# The aggregate that branch protection can require deliberately stays in the
# CALLING workflow. A reusable workflow's jobs are reported as
# `<caller job> / <called job>`, so hosting the aggregate here would rename the
# check run from `Browser E2E` to `Browser E2E / Browser E2E` and break the one
# property that job exists for — a stable name decoupled from the shard count.

on:
  workflow_call:

# Pinned at the workflow level for the same reason ci.yml and dev-ci.yml pin
# them: PYTHONHASHSEED unset lets CPython salt str hashing per process, and a
# seed derived per run makes two runs of one commit incomparable. A called
# workflow inherits neither from its caller, so they are declared again here.
env:
  PYTHONHASHSEED: "0"
  CB_TEST_SEED: "20260826"

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Pinned to the Playwright image so rendering matches the container the
    # REL-18 visual baselines are generated in. A version skew between this tag
    # and the @playwright/test version in package.json shows up as
    # unexplainable screenshot diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Steps in a container run as root, but the runner mounts $HOME at
    # /github/home owned by the image's `pwuser`. Firefox refuses to start in
    # that situation ("Running Nightly as root in a regular user's session is
    # not supported"); /root is root's own directory, so the check succeeds.
    # Nothing in this job needs $HOME to persist.
    env:
      HOME: /root
    # REL-20: Playwright's --shard is deterministic by construction — it sorts
    # the test list and slices it — so shard N holds the same specs on every
    # run. Two shards, not four: each one still pays the production build in
    # playwright.config.ts's webServer, so the split stops paying for itself
    # quickly.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      # No `cache: npm` here, unlike every other job: this one runs inside the
      # Playwright container with HOME forced to /root, so the directory the
      # cache step saves is not the one restored next run. The mismatch is
      # silent — a cache that never hits costs an upload per shard for nothing.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install frontend deps
        run: cd apps/frontend && npm ci

      - name: Record the run manifest
        run: |
          mkdir -p artifacts
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=browser-e2e"
            echo "shard=${{ matrix.shard }}/${{ strategy.job-total }}"
            echo "image=mcr.microsoft.com/playwright:v1.63.0-noble"
            echo "node=$(node -v)"
            echo "playwright=$(cd apps/frontend && npx playwright --version)"
            echo "CB_TEST_SEED=${CB_TEST_SEED}"
          } | tee artifacts/run-manifest.txt

      # The visual-* projects carry the REL-18 baselines (committed 2026-08-19,
      # see docs/testing-visual-baselines.md). They are separate projects so a
      # stale baseline fails the visual gate and not the functional one;
      # playwright.config.ts keeps visual.spec.ts out of the other four.
      - name: Run Playwright suite
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: scripts/ci/tier2-browser.sh "${SHARD}"

      # REL-20: a failed job must be diagnosable from retained artifacts alone.
      # playwright.config.ts already writes the JUnit report and keeps traces,
      # screenshots and video on failure; test-results/ is where those land, so
      # the two paths below cover every artifact class this job produces.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
