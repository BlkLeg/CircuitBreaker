[build-system]
# >=1.27 is load-bearing: it is the first hatchling that understands the PEP 639
# `license = "MIT"` SPDX string below. An older backend rejects it as "must be a table".
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "circuit-breaker-backend"
# Runtime pins for Docker / `pip install -r requirements.txt` live in
# apps/backend/requirements.txt, generated from apps/backend/poetry.lock via:
#   python3 scripts/gen_requirements.py
# After changing dependencies here, refresh the lockfile and regenerate that file.
dynamic = ["version"]
requires-python = ">=3.12,<4"
# GOV-11: this must agree with /LICENSE, /package.json, /nfpm.yaml and /PKGBUILD.
# PEP 639 SPDX expression - deliberately no "License :: OSI Approved" classifier,
# which PEP 639 forbids alongside a license expression.
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # Upper bound is load-bearing, not caution: from 0.138 `include_router` keeps
    # an internal wrapper in `app.routes` instead of the flattened routes, so the
    # SEC-06/07 endpoint inventory sees 4 routes instead of 428 and the security
    # gate stops covering the API. Raise it only together with the route walk in
    # scripts/generate_endpoint_inventory.py and tests/test_endpoint_policy_inventory.py.
    "fastapi>=0.111.0,<0.137",
    "uvicorn[standard]>=0.29.0",
    "uptime-kuma-api-v2>=1.0.1",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "alembic>=1.13.0",
    "python-multipart>=0.0.31",
    "PyJWT>=2.13.0,<3.0.0",
    "pyasn1>=0.6.4",
    "bcrypt>=4.0",
    "Pillow>=12.3.0",
    "slowapi>=0.1.9; python_version < \"4.0\"",
    "markdown-it-py[plugins]>=3.0.0",
    "bleach>=6.4.0",
    "prometheus-client>=0.20.0",
    "pyipmi>=0.4.0",
    "cryptography>=50.0.0",
    "dissononce>=0.34.3",
    "requests>=2.33.0",
    "python-nmap>=0.7.1",
    "pysnmp>=6.1",
    "scapy>=2.5; python_version < \"4.0\"",
    "netaddr>=0.10",
    "apscheduler>=3.10",
    "dnspython>=2.6",
    "httpx>=0.27",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "nats-py>=2.9.0",
    "zeroconf>=0.149.16",
    "manuf>=1.1.5",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "aiosmtplib>=5.1.1",
    "proxmoxer>=2.0.0",
    "urllib3>=2.7.0",
    "psutil>=5.9.0",
    "pyotp>=2.9.0",
    "cachetools>=5.3.0",
    "docker>=7.0.0",
    "boto3>=1.35.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
analytics = [
    "duckdb>=1.0.0",
    "duckdb-engine>=0.13.0",
]
mobile = [
    # Optional: SSH-based DHCP lease snooping (Layer 4 phone discovery)
    "asyncssh>=2.23.0",
]
otel = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]
dev = [
    # PyInstaller does not yet support every CPython in our declared `<4` range; keep
    # the marker so `poetry lock` can resolve without pretending pyinstaller installs on 3.15+.
    "pyinstaller>=6.0.0; python_version < \"3.15\"",
    "moto[s3]>=5.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.0",
    "factory-boy>=3.3",
    "faker>=26.0",
    "freezegun>=1.5",
    "respx>=0.21",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "mypy-extensions>=1.0.0",
    "types-bleach>=6.0.0",
    "types-requests>=2.32.0",
    "types-cachetools>=5.3.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    # Security floors for transitive packages retained in the all-groups lock.
    "msgpack>=1.2.1",
    "pip>=26.1.2",
    "pymdown-extensions>=11.0.1",
    "setuptools>=83.0.0",
]
security = [
    "bandit>=1.7.0",
    "semgrep>=1.50.0",
    "pip-audit>=2.7.0",
]
docs = [
    "zensical>=0.0.24",
    "mkdocs-material>=9.7.3",
]

[tool.hatch.version]
# Read version from the canonical VERSION file at the repo root.
# To release a new version: edit /VERSION, then rebuild.
path = "../../VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
python_version = "3.12"
# Start permissive: ignore missing stubs for third-party libraries so mypy
# can be adopted gradually without requiring every dependency to ship py.typed.
ignore_missing_imports = true
# mypy 1.x separates [import] (not found) from [import-untyped] (found, no stubs).
# Stubs for our third-party deps are listed in pyproject dev extras but are not
# always installed in the venv; suppress the error code instead of requiring a
# specific venv setup to pass CI.
disable_error_code = ["import-untyped"]
# Restore pre-mypy-0.980 behaviour: allow `def f(x: int = None)` patterns.
# Existing API routers use this style; a dedicated cleanup pass can remove
# this flag once signatures are updated to use Optional[int] explicitly.
no_implicit_optional = false
# Warn on unreachable code; skip unused-ignores to avoid false positives
# while the codebase is being gradually annotated.
warn_unreachable = true
warn_unused_ignores = true
# Exclude test fixtures and migration files from strict checks.
exclude = [
    "tests/",
    "migrations/",
]

[[tool.mypy.overrides]]
module = [
    "app.services.discovery_probes",
    "app.services.discovery_service",
]
# python-nmap has no stubs and no py.typed marker. Whether mypy treats
# `import nmap` as Module or Any depends on how it resolves the package,
# which changes with environment and cache state. The type: ignore[assignment]
# on the `nmap = None` fallback is correct when mypy sees a Module type,
# but triggers [unused-ignore] when mypy infers Any. Disabling
# warn_unused_ignores here keeps the ignore stable in both environments.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "app.services.discovery_dhcp",
    "app.services.discovery_fingerprint",
]
# asyncssh and ping3 are optional; imported inside try/except so mypy
# may flag them differently depending on the environment. Suppress to keep
# the type-ignore stable across environments.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "app.api.compute_units",
    "app.api.discovery",
    "app.main",
]
# Pre-existing type issues in these modules — suppressed until a dedicated
# type-hardening pass is done in a future phase.
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
timeout = 30
addopts = [
    "-x",
    "--tb=short",
    "-q",
    "--cov=./src/app",
    "--cov-report=xml",
    "--cov-report=term-missing",
    # Ratcheted to the suite's real coverage. Measured 2026-08-09 at 55.42%
    # (2146 tests, 31717 statements, 14141 missed); re-measured 2026-08-19 at
    # 57.78% (2378 tests, 32450 statements, 13702 missed) after the v1
    # remediation plans added tests. Raised 55 -> 56 on that re-measurement,
    # which is the only way to raise it: the coverage clears the new figure
    # before the number moves. 56 rather than 57 leaves margin for the CI
    # interpreter (3.12) differing slightly from the one this was measured on
    # (3.14). The pre-remediation 60 was aspirational and never met, which is
    # why no CI job could run pytest at all. Never lower this to make a red
    # build green.
    "--cov-fail-under=56",
]
# REL-08: un-awaited coroutine warnings and deprecations are tracked defects,
# not noise. Errors by default; every ignore below names an owner and a removal
# condition, and RC-08 requires this list to be empty or explained at sign-off.
#
# Enumerated on the full 2378-test run, 2026-08-19. The RuntimeWarnings this
# turned up were real: "coroutine 'AsyncMockMixin._execute_mock_call' was never
# awaited" in the SNMP probes was `async for` over pysnmp's next_cmd, a
# coroutine rather than an async generator — fixed in discovery_probes.py, not
# ignored here.
#
# Three warnings survive a full run and are tracked rather than silenced,
# because none is reachable by a filter here — they are raised outside a test's
# warning-capture context, so `error::` does not convert them:
#   1. StarletteDeprecationWarning, raised at import of
#      tests/api/test_monitor_stream_auth.py (collection time).
#   2. CryptographyDeprecationWarning from scapy's FFDH import. It subclasses
#      UserWarning, not DeprecationWarning, so the rules below never see it.
#   3. PytestUnraisableExceptionWarning wrapping "coroutine
#      'AsyncMockMixin._execute_mock_call' was never awaited". Raised at GC
#      finalization, so the test it is reported against is where collection
#      happened to run, not where the coroutine was created — tracemalloc puts
#      the allocation inside the ASGI middleware chain of
#      tests/services/test_monitor_probe_cancellation.py. shawnji (backend):
#      open, needs localisation under PYTHONTRACEMALLOC before it can be fixed.
#      The suite's other nine instances of this warning were real and are fixed
#      (see discovery_probes.py).
filterwarnings = [
    "error::RuntimeWarning",
    "error::DeprecationWarning",
    # shawnji (backend): starlette's TestClient still imports httpx 0.x. Remove
    # when starlette supports httpx2 or the suite drops starlette.testclient
    # (only tests/api/test_monitor_stream_auth.py uses it).
    # UserWarning, not DeprecationWarning: StarletteDeprecationWarning
    # subclasses UserWarning despite its name, so the previous spelling matched
    # nothing and this entry had been inert since starlette 1.x.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    # shawnji (backend): slowapi calls asyncio.iscoroutinefunction, deprecated
    # in 3.14 and slated for removal in 3.16. Does not fire on CI's 3.12.
    # Remove when slowapi moves to inspect.iscoroutinefunction.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
    # shawnji (backend): botocore signs every request with datetime.utcnow(),
    # deprecated in 3.12. Fires only on a 3.14 venv, not CI's 3.12, and turns
    # all of tests/services/test_s3_client.py into setup errors. Remove when
    # botocore moves to datetime.now(datetime.UTC).
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:botocore.auth",
]
markers = [
    "security: security regression tests (from audit report)",
    "slow: tests that take > 2 seconds",
    "e2e: requires Docker; not run by default",
]

[tool.poetry]
# Retained only so `poetry lock` can regenerate poetry.lock, which
# scripts/gen_requirements.py reads. GOV-10: the name, version, description and
# authors that used to sit here said 0.2.0 and admin@example.com, contradicting
# the root VERSION file and the real metadata in [project] above.
package-mode = false
