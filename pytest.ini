# Repo-root pytest configuration.
#
# This file exists for one reason: pytest's built-in `norecursedirs` default
# contains "build", so `pytest tests/` from the repo root silently collected
# ZERO tests from tests/build/ — every repo-policy suite in that directory
# (tracked-file policy GOV-12, governance files GOV-10/11/14/16, cb CLI parity
# SRV-06/GOV-05 and the cb CLI contract, restart probes SRV-03, version parity,
# release channel, AGT-11 extraction dirs, the build script, security
# suppressions). All of it looked like enforcement and enforced nothing,
# because the directory shares a name with a build-output convention. No test
# count is quoted here on purpose — the suite grows, and
# `pytest tests/build --collect-only -q` answers that question exactly.
#
# Overriding it by directory name rather than by listing paths is deliberate:
# a test file — or a subdirectory — added to tests/build/ later is picked up
# without anyone remembering to update a path list in a workflow.
#
# The value below is pytest's documented default with "build" removed and the
# mkdocs output directory ("site") added. The repo has no other directory named
# "build" (`find . -type d -name build` outside .venv, node_modules and .git
# returns only ./tests/build), so nothing else changes about what is collected.
#
# Scope: apps/backend has its own [tool.pytest.ini_options] in its pyproject.toml
# and is always run from that directory (`cd apps/backend && pytest`), so the
# backend suite keeps using that config — coverage gate, asyncio_mode, testpaths
# and all — not this file.
#
# tests/integration/ lives under tests/ but is backend-scoped: its conftest
# imports app.* at collection time and its fixtures need a live PostgreSQL, so
# it is run by `make test-backend` and by nothing else. /conftest.py excludes it
# from root collection and explains why; without that, one un-importable
# conftest aborted `pytest tests/` entirely and the whole repo-policy suite ran
# not at all. Same class of silent loss as the norecursedirs problem above, so
# the exclusion is announced in the run header rather than applied quietly, and
# tests/build/test_root_pytest_scope.py pins both halves.
[pytest]
norecursedirs = *.egg .* _darcs CVS dist node_modules venv site {arch}

# Keeps a bare `pytest` at the repo root on the repo-root suites instead of
# wandering into apps/ with the wrong config. Ignored whenever paths are passed
# explicitly, which is how CI invokes it.
testpaths = tests

# REL-19, second half: "fail unexpected warnings". A warning nobody reads is a
# defect nobody fixes — REL-08 is the same rule stated for coroutines and
# deprecations — so the root suite treats every warning as an error rather than
# printing it into a summary the run is green regardless of.
#
# `error` with an empty ignore list is not an aspiration here: `pytest tests -W
# error` was run against this tree on 2026-08-26 and all 164 root-scoped tests
# passed, so nothing is being silenced to make this line possible. The backend
# suite carries its own, necessarily longer list in
# apps/backend/pyproject.toml; this file governs tests/build and tests/unit
# only.
#
# The rule for adding to this list, enforced by
# tests/build/test_skip_register.py rather than left to habit:
#
#   * Narrow the filter. `ignore:<message regex>:<Category>:<module>` — never a
#     bare `ignore`, and never a whole category, which would hide our own
#     warnings alongside the third-party one being tolerated.
#   * Name an owner from specs/1.0.0/release-control/owner-map.md and a
#     "Remove when ..." condition in the comment directly above the entry. An
#     ignore with no stated way out is a permanent one.
#   * Fix ours instead. A warning raised by app/, cb-agent or these suites is a
#     defect; an ignore for it is how the defect survives to 1.0.0.
#
# RC-08 requires this list to be empty or explained at sign-off. It is empty.
filterwarnings =
    error
