# Ruff configuration for everything OUTSIDE apps/backend — scripts/ and
# scripts/loadgen. apps/backend/pyproject.toml is nearer to src/app and wins
# there, so this file governs the standalone scripts only.
#
# It exists for one reason: to pin the interpreter baseline. Before it, ruff
# inferred a target version, and the inference happened to be py310. Two
# things follow from getting that wrong upward, both of which cost a release
# once already:
#
#   * Jobs that run a scripts/ci script with no actions/setup-python step get
#     the runner's system python3 — 3.10 on ubuntu-22.04. A script written
#     against a higher baseline crashes there while every local gate passes on
#     the 3.12 dev venv. That is how `datetime.UTC` reached
#     scripts/ci/quarantine_notice.py.
#   * At target py312, ruff raises UP017 on that very file and asks for
#     `datetime.UTC` back. A linter configured above the real floor does not
#     merely miss the bug, it argues for it.
#
# So the floor is the lowest interpreter any job actually uses, declared
# rather than inferred — an inference can change with a ruff upgrade, and
# tests/build/test_ci_scripts_match_runner_python.py is the companion check
# that no script exceeds it where it matters.
target-version = "py310"

[lint.isort]
# tomllib is stdlib from 3.11. At target py310 ruff's isort would sort it as a
# third-party import, so scripts/validate_security_suppressions.py — which
# parses .gitleaks.toml with it, under a job that DOES pin 3.12 for exactly
# that reason — would be told to move a stdlib import into its own block.
# Naming it here fixes the classification without raising the global floor.
extra-standard-library = ["tomllib"]
