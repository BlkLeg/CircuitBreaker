# /run/circuitbreaker — created here, and by no unit's RuntimeDirectory=.
#
# Three unit families with three different lifecycles share this directory:
# circuitbreaker-backend.service (writes vault.env), circuitbreaker-worker@
# (five instances, same vault.env) and cb-helperd.service (binds helper.sock,
# which apps/backend/src/app/services/helper_client.py connects to).
#
# All three used to declare RuntimeDirectory=circuitbreaker, and systemd does
# NOT refcount a runtime directory across units: it is removed when ANY unit
# declaring it stops, even while the others are still running. Verified
# directly — two units declaring the same RuntimeDirectory, stop one, and the
# directory is gone while the other is still active.
#
# So one worker exiting deleted the running backend's vault.env and the
# helper's socket directory. On Arch, where all five workers die at startup,
# that is exactly what happened: the installer journey found /run/circuitbreaker
# missing three seconds after the backend had served an authenticated request
# out of it.
#
# The mode and owner are the backend's, not the helper's. ExecStartPre in
# circuitbreaker-backend.service and circuitbreaker-worker@.service runs as
# breaker and writes vault.env here; cb-helperd runs as root and can write
# regardless. While the units created it, the owner and mode depended on
# whichever unit happened to start first — root:root 0755 from the helper would
# silently fail the backend's vault.env write, which is swallowed by `|| true`
# and an EnvironmentFile=- that tolerates the file being absent.
d /run/circuitbreaker 0750 breaker breaker -
