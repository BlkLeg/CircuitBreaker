map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $cb_cache_control {
    ~*\.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$  "public, max-age=31536000, immutable";
    /index.html  "no-cache, no-store, must-revalidate";
    default  "";
}

server {
    listen ${CB_PORT};
    listen [::]:${CB_PORT};
    server_name ${server_name};
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    server_tokens off;

    # Security headers (no HSTS in plain HTTP mode)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gravatar.com https://secure.gravatar.com https://avatars.githubusercontent.com; connect-src 'self' ws: wss: https://geocoding-api.open-meteo.com https://api.open-meteo.com; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cache-Control $cb_cache_control;

    # ACME HTTP-01. The CA fetches this with no credentials and before any certificate
    # exists, so it must be answered here rather than redirected or handed to the SPA.
    # `^~` stops a later regex location taking the request; `root`, not `alias`, because
    # nginx appends the whole URI and certbot writes the token to
    # ${CB_DATA_DIR}/acme-challenge/.well-known/acme-challenge/<token>.
    location ^~ /.well-known/acme-challenge/ {
        root ${CB_DATA_DIR}/acme-challenge;
        default_type "text/plain";
        access_log off;
    }

    # API + WebSocket + SSE
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend-served assets
    location /user-icons/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /branding/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated install script (spec §2.3's
    # `curl https://cb.example.com/install-agent.sh`), served by the backend.
    # Without this exact match the SPA catch-all below answers it via
    # `try_files ... /index.html`, so curl -f sees a 200, writes HTML to disk,
    # and the operator's `sha256sum -c` fails against the digest the API gave
    # them.
    #
    # X-Forwarded-Proto is load-bearing, not boilerplate: main.py's
    # /install-agent.sh route and api/agents.py's /install-command endpoint
    # both build the script's CB_SERVER_URL from request.url.scheme, and
    # uvicorn takes that scheme from this header. If only one of the two
    # locations sets it they disagree on http vs https, the served script
    # differs from the hashed one, and the digest check fails again for a
    # subtler reason.
    location = /install-agent.sh {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        root /opt/circuitbreaker/share/frontend;
        try_files $uri $uri/ /index.html;
    }
}
