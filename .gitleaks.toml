# Extend default Gitleaks rules; allowlist Alembic migration revision IDs (hex hashes).
# Revision IDs like b4a9c1d2e8f0 in down_revision are not secrets.
[extend]
useDefault = true

[[allowlists]]
id = "alembic-revisions"
description = "Alembic migration revision IDs (hex hashes) are not API keys"
paths = ['apps/backend/migrations/.*\\.py']

[[allowlists]]
id = "third-party-venv-example-tokens"
description = "fastapi_users bearer.py embeds an example JWT in its OpenAPI schema; these are .venv pyc false positives"
paths = ['\\.venv/.*', 'apps/backend/\\.venv/.*']

[[allowlists]]
id = "runtime-tls-certs"
description = "Runtime self-signed TLS certs generated by entrypoint-mono.sh on first container start; never committed"
paths = ['docker/data/tls/.*', 'docker/circuitbreaker-data/tls/.*']

[[allowlists]]
id = "security-scan-output"
description = "Generated scan report can quote redacted findings and must not recursively scan itself"
paths = ['security_scan_report\.md$']

[[allowlists]]
id = "runtime-data"
description = "Local runtime data directories are gitignored and are not source or release artifacts"
paths = ['apps/backend/data/.*', 'data/.*', 'docker/data/.*', 'docker/circuitbreaker-data/.*']

[[allowlists]]
id = "documented-and-test-fixtures"
description = "Explicitly fake credentials used in security documentation and isolated test fixtures"
paths = [
  'SECURITY_PATCHES/scanner_false_positives_2026-03-12\.md$',
  # GOV-12 untracked apps/agent/e2e/.env and moved the placeholders into
  # .env.example, which the anchored `\.env$` pattern no longer matched.
  # Both are named: the untracked .env still exists in a developer working
  # tree, and the working tree is what the local gate scans.
  'apps/agent/e2e/\.env(\.example)?$',
  'apps/backend/tests/services/test_agent_install\.py$',
  'plans/2026-07-27-cb-agent-slice1\.md$',
  'apps/backend/\.dev-data/\.env$',
]

# `cb config validate` calls validate_secret_value(_JWT_SECRET_LABEL, jwt_secret,
# min_length=_SECRET_MIN_LENGTH); generic-api-key sees `secret`/`key` next to an
# `=` and reports the keyword argument as the credential. This matches on the
# constant's name rather than on a path, so a real secret anywhere in cli.py --
# including on the lines either side of these calls -- still fails the gate.
[[allowlists]]
id = "secret-min-length-kwarg"
description = "min_length=_SECRET_MIN_LENGTH is a keyword argument naming a module constant, not a credential"
regexes = ['_SECRET_MIN_LENGTH']
