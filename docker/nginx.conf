# One Cache-Control policy for the whole server, chosen from the request URI.
# This exists because of an nginx rule that is easy to trip over: add_header is
# inherited from the enclosing level "only if the current level defines no
# add_header directives of its own" -- all-or-nothing, not per header name. A
# lone `add_header Cache-Control ...` inside `location /` therefore silently
# discards every security header the server block declares, from exactly the
# response that needs them most: index.html. Setting Cache-Control once at
# server level off this map keeps the file-serving locations free of add_header
# so inheritance survives. Mirrors deploy/nginx/circuitbreaker*.conf.
# Vite content-hashes every JS/CSS/font name, so those are immutable forever;
# index.html is the entry point and must be re-fetched on every deploy; the
# empty default adds no header at all (nginx skips an add_header whose value is
# empty), leaving proxied API and upload responses to set their own.
map $uri $cb_cache_control {
    # Proxied paths first. These three are served by the backend, which sets its
    # own Cache-Control, and they end in image extensions — so without this arm
    # the rule below also matches them and the response carries TWO conflicting
    # Cache-Control headers. Worse, /branding/login-logo.<ext>, login-bg.jpg and
    # favicon.ico are fixed filenames rendered with no cache-buster, so
    # "immutable" would tell the browser never to revalidate a logo the operator
    # just replaced. An empty value means nginx adds no header at all and the
    # backend's own survives, which is what we want here.
    ~^/(uploads|user-icons|branding)/  "";
    ~*\.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$  "public, max-age=31536000, immutable";
    /index.html  "no-cache, no-store, must-revalidate";
    default  "";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Docker's embedded DNS resolver — re-resolve upstream hostnames every 10 s.
    # Without this, nginx caches the backend IP at startup and breaks after a
    # container rebuild assigns a new IP to the backend service.
    # NOTE: proxy_pass must use a variable (set $backend ...) for this to take effect.
    # Security: $backend is a fixed internal service (backend:8000), not user-controlled; no SSRF from client input. # nosem
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gravatar.com https://secure.gravatar.com https://avatars.githubusercontent.com; connect-src 'self' ws: wss: https://geocoding-api.open-meteo.com https://api.open-meteo.com; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "DENY"                             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Cache-Control $cb_cache_control always;

    # ── Vite-hashed static assets ─────────────────────────────────────────────
    # The long max-age comes from the $cb_cache_control map at the top of this
    # file, not from an add_header here: a per-location add_header would stop
    # nginx inheriting the security headers above into every asset response.
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
    }

    # ── WebSocket: discovery live stream ─────────────────────────────────────
    location = /api/v1/discovery/stream {
        proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket: topology live stream ───────────────────────────────────────
    location = /api/v1/topology/stream {
        proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket: telemetry live stream ───────────────────────────────────────
    location = /api/v1/telemetry/stream {
        proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket: monitor status live stream ──────────────────────────────────
    location = /api/v1/monitors/stream {
        proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 3600s;
    }

    # ── SSE: events stream (long-lived HTTP) ──────────────────────────────────
    location = /api/v1/events/stream {
        proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Upgrade           "";
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # ── User-uploaded content proxied to backend ──────────────────────────────

    # User icon uploads
    location ^~ /user-icons/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade         "";
        proxy_set_header Connection      "";
    }

    # Branding assets (logos, favicons)
    location ^~ /branding/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade         "";
        proxy_set_header Connection      "";
    }

    # Profile photos and all other uploads (e.g. /uploads/profiles/*)
    location ^~ /uploads/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade         "";
        proxy_set_header Connection      "";
    }

    # ── React SPA catch-all ───────────────────────────────────────────────────
    # Serve index.html for all non-file routes so client-side routing works.
    # try_files' fallback is an internal redirect, so $uri is /index.html by the
    # time headers are written and the map above returns no-store for it. This
    # block must declare no add_header of its own, or index.html loses every
    # security header the server block sets.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
