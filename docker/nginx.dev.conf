# TLS front door for NATIVE dev (`make dev-tls`), not for any shipped image.
#
# Why this file exists at all: the agent feature cannot be exercised without a
# TLS terminator. `agent_install._tls_mode_and_pin` computes the SPKI pin an
# agent will verify from the certificate the server actually serves, reading it
# at ${CB_DATA_DIR}/tls/fullchain.pem, and fails closed when that file is
# absent (gap-closure Task 22 — never emit an empty-pin self-signed config).
# `make dev` runs uvicorn and vite over plain HTTP with no terminator and no
# such file, so "Add an agent" returns 503 on a dev box and the whole enroll →
# approve → report path is unreachable locally.
#
# Routing mirrors docker/nginx.mono.conf — same locations, same upstream, same
# header forwarding — with exactly one structural difference: the SPA catch-all
# proxies to the vite dev server instead of serving a built `root`, so hot
# reload survives. Keep the two in sync when adding a backend route; a location
# that exists in mono and not here is a route that works in production and
# 404s (or falls through to vite) in dev, which is the drift this file is
# meant to eliminate rather than create.
#
# The container runs with --network host. That is load-bearing, not
# convenience: on a bridge network the backend would see the docker gateway
# (172.17.0.1) as the socket peer, which is not in `trusted_proxy_cidrs`
# (default 127.0.0.1/32, ::1/128), so `core.forwarded` would discard
# X-Forwarded-Proto and `forwarded_base_url` would hand every agent an
# http:// server_url for an https server.

events {
    worker_connections 1024;
}

error_log /dev/stderr warn;

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;

    # Same all-or-nothing add_header inheritance reason as nginx.mono.conf's
    # map: a per-location add_header would silently drop every security header
    # the server block declares. Dev serves nothing from disk, so this only has
    # to keep the proxied backend's own Cache-Control intact.
    map $uri $cb_cache_control {
        ~^/(uploads|user-icons|branding)/  "";
        default  "";
    }

    server {
        # scripts/dev-tls.sh rewrites this port from CB_DEV_TLS_PORT when it
        # copies this file into place, so the listener and the URL the script
        # prints cannot disagree. 443 is the default, matching
        # docker-compose.yml's CB_PORT_HTTPS.
        listen 443 ssl;
        http2 on;

        # Generated by scripts/dev-tls.sh into ${CB_DATA_DIR}/tls, which is
        # bind-mounted to /data. Same filenames and same layout deploy/setup.sh
        # and docker/entrypoint-mono.sh produce, because the backend reads this
        # exact path to derive the pin.
        ssl_certificate     /data/tls/fullchain.pem;
        ssl_certificate_key /data/tls/privkey.pem;

        client_max_body_size 10m;

        # Mirrors nginx.mono.conf's header set, with two deliberate dev-only
        # differences.
        #
        # 'unsafe-eval' is added to script-src: vite's dev transform and
        # react-refresh evaluate generated module code, which the production CSP
        # correctly forbids and a built bundle never needs.
        #
        # Strict-Transport-Security is omitted, and that is the safer choice
        # here rather than a gap. HSTS would pin your browser to https for this
        # host for two years off a certificate no CA vouches for — and the host
        # is a LAN IP you will hand to something else eventually. Production
        # sends it; a dev box with a self-signed leaf should not.
        #
        # Nothing else is loosened: frame-ancestors 'none' and X-Frame-Options
        # DENY stay exactly as they ship.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gravatar.com https://secure.gravatar.com https://avatars.githubusercontent.com; connect-src 'self' ws: wss: https://geocoding-api.open-meteo.com https://api.open-meteo.com; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cache-Control $cb_cache_control always;

        set $backend "http://127.0.0.1:8000";
        set $frontend "http://127.0.0.1:5173";

        # ── Streams (WebSocket / SSE) ──────────────────────────────────────
        location = /api/v1/discovery/stream {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/topology/stream {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/telemetry/stream {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/monitors/stream {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/events/stream {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Upgrade           "";
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }

        # Agent enroll/link — unauthenticated WS; the Noise IK handshake inside
        # the socket is its own authentication, so no Authorization to forward.
        location = /api/v1/agents/enroll {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/agents/link {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/agents/stream {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        # ── Backend ────────────────────────────────────────────────────────
        location ^~ /api/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
            # The mono config uses 30s. The agent binary download is served
            # through this location and a cold `make agent-binaries` build is
            # tens of megabytes over loopback, so dev gets a longer read
            # timeout rather than a truncated first install.
            proxy_read_timeout 120s;
        }

        location ^~ /user-icons/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
        }

        location ^~ /branding/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
        }

        location ^~ /uploads/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
        }

        # Exact match for the same reason nginx.mono.conf gives: without it the
        # catch-all below takes the request and the agent fetches the SPA's
        # index.html instead of the install script.
        location = /install-agent.sh {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
        }

        # ── Vite dev server ────────────────────────────────────────────────
        # Where this intentionally differs from mono, which serves a built
        # bundle from `root`. Upgrade headers are forwarded because vite's HMR
        # client opens a WebSocket back through this same origin.
        #
        # Host is pinned to "localhost" rather than forwarded as $host, and
        # only here. vite.config.ts sets `server.allowedHosts` to localhost /
        # 127.0.0.1 / circuitbreaker.lab, so browsing this front door by LAN IP
        # — which is exactly what you do when a real agent on another machine
        # has to reach the same URL — makes vite reject every asset request
        # with "Blocked request". The backend locations above still forward the
        # real $host, because that is what `forwarded_base_url` turns into the
        # server_url written into every agent's config.
        location / {
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              "localhost";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_read_timeout 3600s;
        }
    }
}
