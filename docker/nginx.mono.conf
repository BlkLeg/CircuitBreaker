events {
    worker_connections 1024;
}

pid /tmp/nginx.pid;
# "stderr" (not /dev/stderr) writes to the inherited fd without reopening it —
# supervisord runs as root, so its child-log pipes are root-owned and a
# breaker-uid nginx cannot reopen them via /dev/stderr.
error_log stderr warn;

http {
    include       mime.types;
    default_type  application/octet-stream;
    # /var/log/nginx (tmpfs, chowned to breaker in the entrypoint) — nginx
    # cannot reopen /dev/stdout for the same reason as error_log above.
    access_log /var/log/nginx/access.log;

    sendfile        on;
    keepalive_timeout  65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    # One Cache-Control policy for the whole HTTPS server, chosen from the request
    # URI. This map exists because of an nginx rule that is easy to trip over:
    # add_header is inherited from the enclosing level "only if the current level
    # defines no add_header directives of its own" -- all-or-nothing, not per
    # header name. A lone `add_header Cache-Control ...` inside `location /`
    # therefore silently discards every security header the server block declares,
    # from exactly the response that needs them most: index.html. Setting
    # Cache-Control once at server level off this map keeps the file-serving
    # locations free of add_header so inheritance survives. Mirrors
    # deploy/nginx/circuitbreaker*.conf, which has always done it this way.
    # Vite content-hashes every JS/CSS/font name, so those are immutable forever;
    # index.html is the entry point and must be re-fetched on every deploy; the
    # empty default adds no header at all (nginx skips an add_header whose value
    # is empty), leaving proxied API and upload responses to set their own.
    map $uri $cb_cache_control {
        # Proxied paths first. These three are served by the backend, which sets its
        # own Cache-Control, and they end in image extensions — so without this arm
        # the rule below also matches them and the response carries TWO conflicting
        # Cache-Control headers. Worse, /branding/login-logo.<ext>, login-bg.jpg and
        # favicon.ico are fixed filenames rendered with no cache-buster, so
        # "immutable" would tell the browser never to revalidate a logo the operator
        # just replaced. An empty value means nginx adds no header at all and the
        # backend's own survives, which is what we want here.
        ~^/(uploads|user-icons|branding)/  "";
        ~*\.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$  "public, max-age=31536000, immutable";
        /index.html  "no-cache, no-store, must-revalidate";
        default  "";
    }

    # Retry-After for the warming-up 503, chosen from the response status for
    # exactly the reason the map above exists. `location @backend_warming_up`
    # used to carry `add_header Retry-After 5 always;` of its own, and because
    # add_header inheritance is all-or-nothing per level, that single line threw
    # away all seven headers the HTTPS server block declares -- from the 503 an
    # unauthenticated client gets for every request during container start, which
    # is both the first response most scanners ever see and the one served while
    # the app is least able to defend itself. Keying the value off $status keeps
    # the named location free of add_header so inheritance survives: $status is
    # already resolved by the time the header filter evaluates add_header, and
    # the empty default adds no header at all (nginx skips an add_header whose
    # value is empty), so no other response grows a Retry-After. A 503 that comes
    # straight back from the backend on a location with no `error_page 502 503
    # 504 = @backend_warming_up` -- the WebSocket and SSE streams -- picks up the
    # same 5 seconds, which is the advice we would give there anyway.
    map $status $cb_retry_after_for_status {
        503      "5";
        default  "";
    }

    # ...but not when the response already carries one. `Retry-After` is a
    # singleton field (RFC 9110 5.5), and `core/write_admission._rejection()`
    # returns 503 with its own `Retry-After: 5` for every mutating /api/ request
    # while the app is NOT_READY or DRAINING. `proxy_intercept_errors` is off,
    # so that response is relayed verbatim and the server-level `add_header`
    # below appended a second copy — reproduced against nginx with a stub
    # upstream, two `retry-after: 5` lines on one response. The two values agree
    # today only by coincidence: `_RETRY_AFTER_S = "5"` in Python and `503 "5";`
    # above are maintained independently with nothing coupling them.
    #
    # This is the same exclusion the sibling `$uri`/`$cb_cache_control` map makes
    # for `/uploads/`, `/user-icons/` and `/branding/` — where the backend also
    # sets its own header and nginx must keep out of the way — expressed on the
    # axis that actually decides it here, which is whether the upstream sent one.
    map $upstream_http_retry_after $cb_retry_after {
        ""       $cb_retry_after_for_status;
        default  "";
    }

    # -------------------------------------------------------------------------
    # Server block 1: HTTP (container port 8080) — redirect to HTTPS.
    # The probe endpoints are exempted so Docker healthchecks still work over
    # HTTP. This must stay in sync with the HEALTHCHECK in Dockerfile.mono:
    # anything not matched here falls through to the 301 below, and a probe
    # that follows a redirect chain is not a probe of the backend at all.
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        client_max_body_size 10m;

        add_header Retry-After $cb_retry_after always;

        # This block must declare no add_header of its own. Retry-After comes
        # from the server-level directive plus the $cb_retry_after map at the
        # top of this file; one add_header here and nginx stops inheriting
        # every header the enclosing server block sets.
        location @backend_warming_up {
            default_type application/json;
            return 503 '{"status":"warming_up","message":"Service is starting up, please retry in a few seconds."}';
        }

        set $backend "http://127.0.0.1:8000";

        location ~ ^/api/v1/(health|livez|readyz|startupz)$ {
            proxy_connect_timeout  5s;
            proxy_next_upstream    error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @backend_warming_up;

            proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
        }

        # ACME HTTP-01. `^~` stops a later regex location taking the request, and this
        # block staying reachable is why the redirect below is a `location /` and not a
        # server-level `return`: a server-level return runs in the server rewrite phase,
        # before nginx picks a location, and would 301 the CA off to a certificate that
        # does not exist yet -- the single most common way webroot validation fails.
        # `root`, not `alias`: nginx appends the whole URI to it, and certbot writes to
        # /data/acme-challenge/.well-known/acme-challenge/<token>.
        location ^~ /.well-known/acme-challenge/ {
            root /data/acme-challenge;
            default_type "text/plain";
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # Server block 2: HTTPS (container port 8443) — main application server.
    # TLS expects certs under /data/tls/{fullchain.pem,privkey.pem}.
    # -------------------------------------------------------------------------
    server {
        listen 8443 ssl http2;
        ssl_certificate     /data/tls/fullchain.pem;
        ssl_certificate_key /data/tls/privkey.pem;

        root   /app/frontend/dist;
        index  index.html;
        client_max_body_size 10m;

        # This block must declare no add_header of its own. Retry-After comes
        # from the server-level directive plus the $cb_retry_after map at the
        # top of this file; one add_header here and nginx stops inheriting
        # every header the enclosing server block sets.
        location @backend_warming_up {
            default_type application/json;
            return 503 '{"status":"warming_up","message":"Service is starting up, please retry in a few seconds."}';
        }

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gravatar.com https://secure.gravatar.com https://avatars.githubusercontent.com; connect-src 'self' ws: wss: https://geocoding-api.open-meteo.com https://api.open-meteo.com; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cache-Control $cb_cache_control always;
        add_header Retry-After $cb_retry_after always;

        # Hashed static assets. The long max-age comes from the
        # $cb_cache_control map, not from an add_header here: a per-location
        # add_header would stop nginx inheriting the security headers above
        # into every asset response.
        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
            try_files $uri =404;
        }

        # Backend API + streams
        set $backend "http://127.0.0.1:8000";

        # WebSocket / SSE endpoints (mirrors docker/nginx.conf behavior).
        location = /api/v1/discovery/stream {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/topology/stream {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/telemetry/stream {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/monitors/stream {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/events/stream {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Upgrade           "";
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }

        # Agent enroll/link — unauthenticated WS; the Noise IK handshake
        # performed inside these sockets is their own authentication
        # (spec §3.5). No Authorization header to forward.
        location = /api/v1/agents/enroll {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location = /api/v1/agents/link {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Agent presence push to the UI (Task 15) — session-authenticated.
        location = /api/v1/agents/stream {
            proxy_pass         $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 3600s;
        }

        # Backend API proxy
        location ^~ /api/ {
            proxy_connect_timeout  5s;
            proxy_next_upstream    error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @backend_warming_up;

            proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header Upgrade           "";
            proxy_set_header Connection        "";
            proxy_read_timeout 30s;
        }

        # User-uploaded content proxied to backend
        location ^~ /user-icons/ {
            proxy_connect_timeout  5s;
            proxy_next_upstream    error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @backend_warming_up;

            proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade         "";
            proxy_set_header Connection      "";
        }

        location ^~ /branding/ {
            proxy_connect_timeout  5s;
            proxy_next_upstream    error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @backend_warming_up;

            proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade         "";
            proxy_set_header Connection      "";
        }

        location ^~ /uploads/ {
            proxy_connect_timeout  5s;
            proxy_next_upstream    error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @backend_warming_up;

            proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade         "";
            proxy_set_header Connection      "";
        }

        # Unauthenticated install script (Task 17) — a clean top-level path per
        # spec §2.3's `curl https://cb.example.com/install-agent.sh` examples.
        # Without this exact-match block, the SPA catch-all below intercepts it
        # first (try_files falls through to index.html for any unmatched
        # filesystem path) and the backend's route is never reached.
        location = /install-agent.sh {
            proxy_connect_timeout  5s;
            proxy_next_upstream    error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @backend_warming_up;

            proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal,generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade         "";
            proxy_set_header Connection      "";
        }

        # React SPA catch-all. try_files' fallback is an internal redirect, so
        # $uri is /index.html by the time headers are written and the map above
        # returns no-store for it. This block must declare no add_header of its
        # own, or index.html loses every security header the server block sets.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

